<title>RPG Table — AI Tabletop Roleplay</title>
<style>
:root{
  --bg:#0d0d0f; --bg2:#141417; --side:#111113; --panel:#18181c; --panel2:#1f1f24; --hover:#26262c;
  --line:#2a2a31; --line2:#222228; --text:#e7e5e0; --muted:#8f8c86; --dim:#6a6863;
  --accent:#c9a45c; --accent2:#e6c886; --accentbg:rgba(201,164,92,.12);
  --red:#e0675a; --green:#6fbf73; --blue:#6ea4e0; --purple:#a98be0;
  --radius:12px; --fs:15px;
  --sans:Inter,"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --display:"Cinzel","Trajan Pro","Palatino Linotype","Book Antiqua",Georgia,serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
}
body.light{
  --bg:#f6f4ef; --bg2:#efece5; --side:#ebe7de; --panel:#ffffff; --panel2:#f3f0e9; --hover:#e8e3d8;
  --line:#d9d3c6; --line2:#e4dfd4; --text:#24211c; --muted:#6d675d; --dim:#958e82;
  --accent:#9a7425; --accent2:#7d5c16; --accentbg:rgba(154,116,37,.10);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:var(--fs)/1.55 var(--sans);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent2)}
::selection{background:rgba(201,164,92,.35)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2c2c33;border-radius:10px;border:2px solid var(--bg)}
body.light ::-webkit-scrollbar-thumb{background:#cfc8ba}
h1,h2,h3,h4{margin:.1em 0 .5em;font-weight:600;letter-spacing:.01em}
h2{font-size:1.15rem}h3{font-size:1rem}h4{font-size:.92rem;color:var(--muted)}
.display{font-family:var(--display);letter-spacing:.06em}
input,select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:0;transition:border-color .15s}
input:hover,select:hover,textarea:hover{border-color:#3a3a42}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg)}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{resize:vertical;min-height:60px;width:100%;line-height:1.45}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;vertical-align:-3px;margin:0 6px 0 0}
input[type=number]{width:76px}
input[type=range]{accent-color:var(--accent);padding:0}
label{color:var(--muted);font-size:.86rem}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 12px;cursor:pointer;transition:.12s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover);border-color:#3a3a42}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1408;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red)}
.btn.danger:hover{background:rgba(224,103,90,.12);border-color:rgba(224,103,90,.4)}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{padding:3px 9px;font-size:.84rem;border-radius:7px}
.btn.icon{padding:5px 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.small{font-size:.86rem}.tiny{font-size:.76rem}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);padding:16px}
.card + .card{margin-top:14px}
.sect-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);margin:14px 0 6px;font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:.74rem;color:var(--muted);background:var(--bg2)}
.badge.accent{color:var(--accent2);border-color:rgba(201,164,92,.35);background:var(--accentbg)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:.78rem;background:var(--panel2);border:1px solid var(--line);cursor:pointer;user-select:none}
.chip.on{background:var(--accentbg);border-color:rgba(201,164,92,.45);color:var(--accent2)}
.chip.cond{background:rgba(169,139,224,.12);border-color:rgba(169,139,224,.35);color:#cbb8f0}
.chip.cond:hover{text-decoration:line-through}
.note{border-radius:10px;padding:9px 12px;font-size:.87rem;border:1px solid}
.note.warn{background:rgba(224,170,80,.08);border-color:rgba(224,170,80,.3);color:#e9c98d}
.note.err{background:rgba(224,103,90,.08);border-color:rgba(224,103,90,.35);color:#f0a59b}
.note.ok{background:rgba(111,191,115,.08);border-color:rgba(111,191,115,.35);color:#a8dcaa}
.note.info{background:var(--accentbg);border-color:rgba(201,164,92,.3);color:var(--text)}
body.light .note.warn{color:#7a5410}body.light .note.err{color:#a5352a}body.light .note.ok{color:#2f6b32}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field > input,.field > select{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-family:var(--mono);font-size:.78em;background:var(--bg2);color:var(--muted)}

/* ===== App shell ===== */
.app{display:grid;grid-template-columns:272px 1fr;height:100vh;height:var(--app-h,100dvh);transform-origin:50% 50%}
.app.side-collapsed{grid-template-columns:0 1fr}
.app.side-collapsed .sidebar{visibility:hidden}
.sidebar{background:var(--side);border-right:1px solid var(--line2);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.side-top{padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 4px 6px}
.sigil{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,#e6c886,#9a7425);color:#1a1408;font-weight:700;font-size:.72rem;font-family:var(--display)}
.brand b{font-family:var(--display);letter-spacing:.08em;font-size:.95rem}
.side-search{width:100%}
.side-scroll{flex:1;overflow:auto;padding:4px 8px 10px}
.folder{margin-top:6px}
.folder-h{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:8px;color:var(--muted);font-size:.8rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;user-select:none}
.folder-h:hover{background:var(--hover);color:var(--text)}
.folder-h .caret{transition:.15s;display:inline-block;width:10px}
.folder.collapsed .caret{transform:rotate(-90deg)}
.folder.collapsed .folder-items{display:none}
.folder-h .acts{margin-left:auto;display:none;gap:2px}
.folder-h:hover .acts{display:flex}
.folder.drop-target .folder-h{background:var(--accentbg);color:var(--accent2)}
.chat-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;cursor:pointer;font-size:.9rem;position:relative;color:var(--text)}
.chat-item:hover{background:var(--hover)}
.chat-item.active{background:var(--panel2);box-shadow:inset 2px 0 0 var(--accent)}
.chat-item .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .pin{color:var(--accent);font-size:.75rem}
.chat-item .more{opacity:0;padding:0 6px;border-radius:6px;background:none;border:none;cursor:pointer;color:var(--muted)}
.chat-item:hover .more,.chat-item.active .more{opacity:1}
.chat-item .more:hover{background:var(--line)}
.side-nav{border-top:1px solid var(--line2);padding:8px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nav-btn{background:none;border:1px solid transparent;border-radius:9px;padding:6px 2px;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.68rem}
.nav-btn span.i{font-size:1.05rem;line-height:1}
.nav-btn:hover{background:var(--hover);color:var(--text)}
.nav-btn[aria-current=true]{color:var(--accent2);background:var(--accentbg)}
.side-foot{display:flex;align-items:center;gap:6px;padding:6px 12px 10px;font-size:.76rem;color:var(--dim)}
.save-ind{display:inline-flex;align-items:center;gap:5px}
.save-ind i{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
.save-ind.saving i{background:var(--accent);animation:pulse 1s infinite}
.save-ind.error i{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line2);min-height:54px;flex-wrap:wrap}
.topbar .title{font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw;cursor:text}
.view{display:none;flex:1;min-height:0;overflow:auto}
.view.active{display:flex;flex-direction:column}
.view-pad{padding:18px 22px;max-width:1280px;width:100%;margin:0 auto}

/* ===== Chat ===== */
.chat-wrap{display:grid;grid-template-columns:1fr 320px;flex:1;min-height:0}
.chat-wrap.no-right{grid-template-columns:1fr 0}
.chat-wrap.no-right .rpanel{display:none}
.chat-center{display:flex;flex-direction:column;min-height:0;min-width:0}
.chatlog{flex:1;overflow:auto;padding:22px 0 10px}
.chatlog-inner{max-width:820px;margin:0 auto;padding:0 22px;display:flex;flex-direction:column;gap:4px}
.msg{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:10px 10px;border-radius:12px;position:relative}
.msg:hover{background:rgba(255,255,255,.018)}
body.light .msg:hover{background:rgba(0,0,0,.025)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.78rem;color:#121212;background:var(--c,#777);flex:none;letter-spacing:.02em;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.avatar.sq{border-radius:10px}
.msg .head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.msg .who{font-weight:600;color:var(--c,var(--text));font-size:.92rem}
.msg .role{font-size:.74rem;color:var(--dim)}
.msg .time{font-size:.72rem;color:var(--dim);margin-left:auto}
.msg .body{margin-top:2px;overflow-wrap:anywhere}
.msg.gm .body,.msg.char .body,.msg.script .body{font-family:var(--serif);font-size:1.06em;line-height:1.62}
.msg.user{background:var(--panel)}
.msg.user:hover{background:var(--panel)}
.msg.ooc .body{color:var(--muted);font-style:italic}
.msg.aside .body{font-size:.9em;color:var(--muted)}
.msg.system{grid-template-columns:1fr;padding:2px 10px;font-size:.82rem;color:var(--dim);text-align:center}
.msg.system.error{color:var(--red)}
.msg.roll .rollbox{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 12px;margin-top:3px}
.rollbox .total{font-family:var(--mono);font-size:1.25rem;font-weight:700}
.rollbox .bd{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.crit{color:var(--green)!important}.fumble{color:var(--red)!important}
.msg .body p{margin:.15em 0 .55em}.msg .body p:last-child{margin-bottom:0}
.msg .body em{color:#c9c2b4}
body.light .msg .body em{color:#5d564b}
.msg .body .q{color:#f3e3bf}
body.light .msg .body .q{color:#6b4a0c}
.msg .body code{font-family:var(--mono);font-size:.85em;background:var(--panel2);padding:1px 5px;border-radius:5px}
.msg .body pre{background:var(--panel2);padding:10px;border-radius:9px;overflow:auto}
.msg .body pre code{background:none;padding:0}
.msg .body blockquote{margin:.4em 0;padding:2px 12px;border-left:3px solid var(--line);color:var(--muted)}
.msg .body ul,.msg .body ol{margin:.3em 0 .5em;padding-left:1.3em}
.msg .body h1,.msg .body h2,.msg .body h3{font-size:1.02em;margin:.4em 0 .3em;color:var(--accent2)}
.msg .body hr{border:none;border-top:1px solid var(--line);margin:.6em 0}
.seg{display:grid;grid-template-columns:24px 1fr;gap:8px;margin:.35em 0}
.seg .avatar{width:22px;height:22px;font-size:.6rem;margin-top:3px}
.seg .sname{font-family:var(--sans);font-weight:600;font-size:.82rem;color:var(--c)}
.msg-actions{position:absolute;right:8px;top:-12px;display:none;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:2px;z-index:3}
.msg:hover .msg-actions,.msg:focus-within .msg-actions{display:flex}
.msg-actions button{background:none;border:none;border-radius:6px;padding:3px 7px;cursor:pointer;color:var(--muted);font-size:.82rem}
.msg-actions button:hover{background:var(--hover);color:var(--text)}
.swipes{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;color:var(--dim);margin-top:4px}
.swipes button{background:none;border:1px solid var(--line);border-radius:6px;cursor:pointer;color:var(--muted);padding:0 7px}
.swipes button:hover{color:var(--text);border-color:#3a3a42}
.msg.streaming .body > :last-child::after,.msg.streaming .body:empty::after{content:"▍";animation:blink 1s steps(2) infinite;color:var(--accent)}
@keyframes blink{50%{opacity:0}}
.msg .edit-box textarea{min-height:90px;font-family:var(--sans)}
.composer-wrap{padding:6px 22px 14px}
.composer{max-width:820px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 10px 8px 12px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.composer:focus-within{border-color:#3d3d45}
.composer textarea{border:none;background:none;box-shadow:none;min-height:24px;max-height:240px;padding:6px 2px;resize:none}
.composer textarea:focus{box-shadow:none}
.composer .bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.composer select{padding:3px 8px;font-size:.84rem;border-radius:8px}
.statusline{max-width:820px;margin:0 auto 6px;min-height:20px;font-size:.82rem;color:var(--accent2);display:flex;gap:10px;align-items:center}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.meter{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;color:var(--dim)}
.meter .bar{width:70px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;display:block}
.meter .bar i{display:block;height:100%;background:var(--green)}
.meter.mid .bar i{background:var(--accent)}.meter.high .bar i{background:var(--red)}
.empty-state{max-width:620px;margin:8vh auto;text-align:center;color:var(--muted)}
.empty-state h2{font-family:var(--display);color:var(--text);font-size:1.5rem;letter-spacing:.06em}
.rpanel{border-left:1px solid var(--line2);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--side)}
.rpanel .card{padding:12px}
.party-row{display:flex;align-items:center;gap:8px;padding:5px 0}
.party-row .info{flex:1;min-width:0}
.party-row .info b{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hpbar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:3px}
.hpbar > i{display:block;height:100%;background:var(--red)}
.hpbar.good > i{background:var(--green)}.hpbar.mid > i{background:var(--accent)}

/* ===== Dice ===== */
.dice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.die{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:1.05rem;cursor:pointer;display:grid;place-items:center;transition:.12s;color:var(--accent2)}
.die:hover{transform:translateY(-2px);border-color:var(--accent)}
.bigroll{font-size:3.4rem;font-weight:700;text-align:center;line-height:1.1;font-family:var(--mono)}
.bigroll.anim{animation:pop .3s}
@keyframes pop{0%{transform:scale(.6) rotate(-10deg);opacity:.2}100%{transform:none;opacity:1}}
.hist-item{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:7px 4px;border-bottom:1px solid var(--line2);font-size:.86rem}
.hist-item .t{font-family:var(--mono);font-weight:700;grid-row:span 2;align-self:center;font-size:1.1rem}

/* ===== Lists / two-pane ===== */
.pane2{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
@media (max-width:900px){.pane2{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:3px}
.li{padding:8px 10px;border-radius:9px;cursor:pointer;display:flex;gap:9px;align-items:center;border:1px solid transparent}
.li:hover{background:var(--hover)}
.li.sel{background:var(--panel2);border-color:var(--line)}
.li .avatar{width:28px;height:28px;font-size:.68rem}
.li .meta{flex:1;min-width:0}
.li .meta b{display:block;font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .meta span{font-size:.76rem;color:var(--muted)}

/* Character sheet */
.abil-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:900px){.abil-grid{grid-template-columns:repeat(3,1fr)}}
.abil{text-align:center;padding:8px 6px;border:1px solid var(--line);border-radius:12px;background:var(--bg2)}
.abil .an{font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--muted);cursor:pointer}
.abil .an:hover,.abil .mod:hover{color:var(--accent2)}
.abil .mod{font-size:1.45rem;font-weight:700;cursor:pointer;font-family:var(--mono)}
.abil input{width:58px;text-align:center;padding:3px}
.abil .sv{font-size:.74rem;margin-top:5px;color:var(--muted)}
.abil .sv span{cursor:pointer}.abil .sv span:hover{color:var(--accent2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.stat{border:1px solid var(--line);border-radius:12px;padding:6px 8px;background:var(--bg2);text-align:center}
.stat label{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
.stat input{width:62px;text-align:center;padding:3px}
.stat .v{font-family:var(--mono);font-size:1.2rem;font-weight:700}
.rollable{cursor:pointer}.rollable:hover{color:var(--accent2)}
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0 18px}
.skill{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid var(--line2);font-size:.88rem}
.skill select{padding:0 2px;font-size:.78rem;width:42px;border-radius:6px}
.skill .sn{flex:1;cursor:pointer}.skill .sn:hover{color:var(--accent2)}
.skill .sb{font-family:var(--mono);width:30px;text-align:right}
.skill .ab{font-size:.7rem;color:var(--dim);width:26px}
details.sect{border:1px solid var(--line2);border-radius:12px;padding:8px 12px;margin-top:12px;background:var(--panel)}
details.sect > summary{cursor:pointer;font-weight:600;font-size:.9rem;padding:2px 0;list-style:none}
details.sect > summary::before{content:"▸ ";color:var(--dim)}
details.sect[open] > summary::before{content:"▾ "}

/* Combat */
.cmb{display:grid;grid-template-columns:64px minmax(140px,1fr) 56px 190px 240px auto;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line2);border-radius:12px;background:var(--panel);margin-top:6px}
.cmb.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 22px var(--accentbg)}
.cmb.down{opacity:.5}
.cmb .init input{width:56px;text-align:center;font-weight:700}
@media (max-width:1100px){.cmb{grid-template-columns:60px 1fr}}

/* Tree */
.tree,.tree ul{list-style:none;margin:0;padding-left:24px;position:relative}
.tree{padding-left:0}
.tree ul::before{content:"";position:absolute;left:10px;top:0;bottom:18px;border-left:1px dashed var(--line)}
.tree li{position:relative;margin:6px 0}
.tree ul > li::before{content:"";position:absolute;left:-14px;top:19px;width:13px;border-top:1px dashed var(--line)}
.node{display:inline-flex;align-items:center;gap:9px;padding:6px 12px 6px 7px;border:1px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer;min-width:210px}
.node:hover{border-color:#3d3d45}
.node.sel{border-color:var(--accent);background:var(--panel2)}
.node.off{opacity:.42}
.node.active{animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 rgba(201,164,92,0)}to{box-shadow:0 0 14px rgba(201,164,92,.6)}}
.node .avatar{width:26px;height:26px;font-size:.62rem}
.node .meta{display:flex;flex-direction:column;line-height:1.2}
.node .meta b{font-size:.86rem}
.node .meta span{font-size:.72rem;color:var(--muted)}
.mini-tree .node{min-width:0;padding:3px 9px 3px 4px}
.mini-tree .node .avatar{width:18px;height:18px;font-size:.5rem}
.mini-tree .tree li{margin:3px 0}
.mini-tree .tree ul > li::before{top:13px}

/* Bots */
.bot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.bot{border:1px solid var(--line2);border-radius:12px;padding:12px;background:var(--panel);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.bot:hover{border-color:#3d3d45}
.bot.sel{border-color:var(--accent)}
.bot .desc{font-size:.82rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.preset{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border:1px solid var(--line2);border-radius:12px;background:var(--bg2)}
.preset b{font-size:.92rem}
.preset .d{font-size:.78rem;color:var(--muted);grid-column:1}
.preset .a{grid-row:span 2;align-self:center;display:flex;gap:6px}

/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding-top:12vh}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(560px,92vw);max-height:76vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);padding:18px}
.modal h3{margin-top:0}
.palette{padding:0;width:min(620px,92vw)}
.palette input{width:100%;border:none;border-bottom:1px solid var(--line);border-radius:16px 16px 0 0;padding:14px 16px;font-size:1rem;background:none}
.palette input:focus{box-shadow:none}
.pal-list{max-height:52vh;overflow:auto;padding:6px}
.pal-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;cursor:pointer}
.pal-item.sel,.pal-item:hover{background:var(--hover)}
.pal-item .k{margin-left:auto;font-size:.74rem;color:var(--dim)}
.pal-item .g{font-size:.72rem;color:var(--dim);width:72px}
.menu{position:fixed;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:4px;z-index:60;min-width:190px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.menu button{display:flex;width:100%;text-align:left;background:none;border:none;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:.88rem;gap:8px}
.menu button:hover{background:var(--hover)}
.menu hr{border:none;border-top:1px solid var(--line);margin:4px 2px}
.menu .lbl{font-size:.72rem;color:var(--dim);padding:4px 10px}
.toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:80;align-items:flex-end}
.toast{background:var(--panel2);border:1px solid var(--line);padding:9px 14px;border-radius:11px;box-shadow:0 10px 30px rgba(0,0,0,.4);display:flex;gap:12px;align-items:center;font-size:.9rem;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.lock{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:100}
.lock .box{width:min(380px,90vw);text-align:center}
.lock .sigil{width:56px;height:56px;font-size:1.1rem;margin:0 auto 14px;border-radius:16px}

@media (max-width:1100px){.chat-wrap{grid-template-columns:1fr 0}.chat-wrap .rpanel{display:none}.chat-wrap.show-right{grid-template-columns:1fr 300px}.chat-wrap.show-right .rpanel{display:flex}}


@media print{
  body{overflow:visible;background:#fff;color:#000;font-size:12pt}
  .sidebar,.topbar,.composer-wrap,.rpanel,.msg-actions,.swipes,.statusline,.toasts{display:none!important}
  .app,.chat-wrap{display:block;height:auto}
  .view{display:none!important}.view.active{display:block!important;overflow:visible}
  .chatlog{overflow:visible}
  .msg{break-inside:avoid;color:#000}
  .msg .who{color:#000!important}
  .msg .body .q,.msg .body em{color:#000}
}
.xpchip{display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:.8rem;background:var(--bg2)}
.xpchip:hover{border-color:var(--accent)}
.xpchip .bar{width:60px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;display:block}
.xpchip .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.bond{display:flex;align-items:center;gap:6px;margin-top:2px}.bond .tiny{white-space:nowrap}
.bondbar{flex:1}.bondbar > i{background:linear-gradient(90deg,#e07fb5,#e0a45c)!important}
.accent{color:var(--accent2)}
.lockbadge{background:rgba(0,0,0,.25)}

/* ===================== v4: global top bar, 18+ switch, mature theme, transition ===================== */
.side-scrim{display:none}
#viewTitle{display:none}
body:not([data-screen="chat"]) .chat-only{display:none!important}
body:not([data-screen="chat"]) #chatTitle{display:none}
body:not([data-screen="chat"]) #viewTitle{display:block}
.desk-hidden{display:none}
.topbar{position:relative;z-index:5;background:var(--bg)}

.nsfw-switch .track{width:34px;height:18px;border-radius:999px;background:var(--line);position:relative;transition:background .25s}
.nsfw-switch .knob{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#bdb8ae;transition:transform .25s cubic-bezier(.3,1.4,.5,1),background .25s}
.nsfw-switch[aria-checked="true"]{color:#ffd9de;border-color:#8c2a3c;background:linear-gradient(90deg,#3a0f19,#5a1426)}
.nsfw-switch[aria-checked="true"] .track{background:#b3263f}
.nsfw-switch[aria-checked="true"] .knob{transform:translateX(16px);background:#fff}
.nsfw-switch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body.mature{

body.mature.light{--bg:#fbf3f4; --bg2:#f6e8ea; --side:#f3e3e6; --panel:#fff; --panel2:#f8ecee; --hover:#f0dade; --line:#e5c9cf; --line2:#eed8dc; --accent:#a3213b; --accent2:#7d1529; --accentbg:rgba(163,33,59,.10); --muted:#7a5a62}
body.mature .btn.primary{background:linear-gradient(180deg,#d23b58,#a3213b);border-color:#a3213b;color:#fff}
body.mature .sigil{background:linear-gradient(135deg,#7a1a2e,#c8324f)!important;color:#fff!important}
body.mature .xpchip .bar i,body.mature .bondbar i{background:linear-gradient(90deg,#a3213b,#f08aa0)!important}
body.mature .chip.on{border-color:rgba(200,50,79,.5)}
body.mature .bond .tiny::before{content:"♥ ";color:#e05570}
.mature-badge{background:rgba(200,50,79,.16)!important;border-color:rgba(200,50,79,.45)!important;color:#f08aa0!important}
.mode-veil{position:fixed;inset:0;pointer-events:none;z-index:200;opacity:0;display:grid;place-items:center}
.mode-veil-badge{font:700 1.4rem var(--display);letter-spacing:.12em;color:#fff;padding:14px 26px;border-radius:16px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);opacity:0;transform:scale(.9)}
.mode-veil.run{animation:veil .7s ease both}
.mode-veil.run .mode-veil-badge{animation:veilBadge .7s ease both}
.mode-veil.to-mature{background:radial-gradient(circle at 85% 0%,rgba(200,50,79,.85),rgba(90,15,35,.75) 45%,rgba(15,6,9,.6) 80%)}
.mode-veil.to-standard{background:radial-gradient(circle at 85% 0%,rgba(201,164,92,.7),rgba(40,36,30,.7) 50%,rgba(13,13,15,.6) 85%)}
@keyframes veil{0%{opacity:0}35%{opacity:1}70%{opacity:1}100%{opacity:0}}
@keyframes veilBadge{0%{opacity:0;transform:scale(.85)}40%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.06)}}
@media (prefers-reduced-motion: reduce){.mode-veil{display:none}*{scroll-behavior:auto!important}.nsfw-switch .knob,.nsfw-switch .track{transition:none}}

/* ===================== Stories: compact visual cards ===================== */
.scn-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.scn-head h2{margin:0;font:600 1.25rem var(--display);letter-spacing:.03em}
.scn-filters{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.scn-filters input[type=search]{width:100%;max-width:520px}
.chips-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips-scroll::-webkit-scrollbar{display:none}
.chips-scroll .chip,.chips-wrap .chip{white-space:nowrap;padding:4px 11px;font-size:.8rem;color:var(--text);font-family:inherit}
.chips-wrap{display:flex;flex-wrap:wrap;gap:5px;max-height:120px;overflow:auto}
.scn-note{margin:2px 0 12px}
.scn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.scard{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid var(--line2);transition:transform .15s,border-color .15s,box-shadow .15s;min-width:0}

.scard .cover{position:relative;height:84px;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--c) 70%,white 10%),color-mix(in srgb,var(--c) 45%,black 55%))}
.scard .cover .em{font-size:2.3rem;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
.scard .badges{position:absolute;top:7px;right:7px;left:7px;display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:3px;font-size:.68rem;font-weight:600;padding:1px 7px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(4px)}
.pill.mature{background:rgba(160,25,50,.85);border-color:rgba(255,160,175,.4)}
.pill.lock{background:rgba(0,0,0,.65)}
.pill.done{background:rgba(60,110,60,.75)}
.scard .sbody{padding:9px 11px 11px;display:flex;flex-direction:column;gap:4px;min-height:0}
.scard .stitle{font-size:.93rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scard .hook{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .chips{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden}
.tchip{font-size:.68rem;padding:0 7px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.scard.locked .cover{filter:grayscale(.6) brightness(.7)}
.scard.blank .cover{background:repeating-linear-gradient(45deg,var(--panel2) 0 10px,var(--panel) 10px 20px)}
.scard.blank .cover .em{font-size:2rem;color:var(--muted)}

/* ===================== Slide-over sheet (scenario preview/editor) ===================== */
.overlay.sheet-overlay{padding:0;align-items:stretch;justify-content:flex-end}
.sheet{background:var(--panel);width:min(760px,100vw);height:100%;display:flex;flex-direction:column;border-left:1px solid var(--line);box-shadow:-20px 0 60px rgba(0,0,0,.5);animation:sheetIn .22s ease}
@keyframes sheetIn{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}

.sheet-hero .em{font-size:2.6rem;line-height:1}
.sheet-title{margin:2px 0 4px;font:600 1.25rem var(--display)}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line2);overflow-x:auto;scrollbar-width:none}

<script id="core-js">
/* ===== RPG Table core: pure logic (dice, parsing, helpers). Testable in Node. ===== */
(function (root) {
  'use strict';
  var Core = {};

  /* ---------- RNG ---------- */
  var customRng = null;
  Core.setRng = function (fn) { customRng = fn || null; };
  function randInt(n) {
    if (customRng) return 1 + Math.floor(customRng() * n);
    var c = root.crypto;
    if (c && c.getRandomValues) {
      var a = new Uint32Array(1), lim = Math.floor(4294967296 / n) * n, x;
      do { c.getRandomValues(a); x = a[0]; } while (x >= lim);
      return 1 + (x % n);
    }
    return 1 + Math.floor(Math.random() * n);
  }
  Core.randInt = randInt;

  /* ---------- Dice expression parser ----------
     Supports: NdS, d%, kh/kl/k/dh/dl, ! (explode), rN (reroll once <= N),
     + - * / and parentheses, "adv"/"dis" keywords (also "advantage"/"disadvantage").
  */
  var MAX_DICE = 1000, MAX_SIDES = 100000;

  function normalizeExpr(input) {
    var s = String(input == null ? '' : input).toLowerCase().trim();
    var mode = null;
    s = s.replace(/\b(advantage|adv)\b/g, function () { mode = 'adv'; return ' '; });
    s = s.replace(/\b(disadvantage|dis)\b/g, function () { mode = mode === 'adv' ? 'cancel' : 'dis'; return ' '; });
    s = s.replace(/\s+/g, '').replace(/×/g, '*').replace(/÷/g, '/');
    if (mode === 'cancel') mode = null;
    if (mode) {
      var keep = mode === 'adv' ? 'kh1' : 'kl1';
      if (!s) s = 'd20';
      if (/(^|[^0-9a-z])1?d20(?![0-9])/.test(s)) {
        s = s.replace(/(^|[^0-9a-z])1?d20(?![0-9])/, function (m, pre) { return pre + '2d20' + keep; });
      } else if (s.indexOf('d') === -1) {
        s = '2d20' + keep + (/^[+\-]/.test(s) ? s : '+' + s);
      }
    }
    if (!s) s = 'd20';
    return { expr: s, mode: mode };
  }
  Core.normalizeExpr = normalizeExpr;

  function rollDice(count, sides, mods) {
    if (count < 1) throw new Error('Dice count must be at least 1');
    if (count > MAX_DICE) throw new Error('Too many dice (max ' + MAX_DICE + ')');
    if (sides < 1) throw new Error('Die size must be at least 1');
    if (sides > MAX_SIDES) throw new Error('Die too large');
    var rolls = [], budget = 2000;
    for (var i = 0; i < count; i++) {
      var r = { v: randInt(sides), kept: true };
      if (mods.reroll != null && r.v <= mods.reroll && sides > mods.reroll) {
        r.rerolled = r.v; r.v = randInt(sides);
      }
      rolls.push(r);
      if (mods.explode && sides > 1) {
        var last = r;

/* ===================== Storage: IndexedDB (+ optional AES-GCM encryption) ===================== */
const Store = {
  db: null, key: null, meta: null, useLS: false, NAME: 'rpg-table', LSP: 'rpgtable:',
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open(this.NAME, 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('IndexedDB blocked'));
      });
    } catch (e) {
      console.warn('IndexedDB unavailable, falling back to localStorage', e);
      this.useLS = true;
      try { localStorage.setItem(this.LSP + '_probe', '1'); localStorage.removeItem(this.LSP + '_probe'); }
      catch (e2) { console.warn('localStorage blocked too (e.g. content:// on Android) — keeping data in memory only', e2); this.useMem = true; this.mem = new Map(); }
    }
    this.meta = (await this.rawGet('meta')) || { encrypted: false };
  },
  rawGet(k) {
    if (this.useMem) return Promise.resolve(this.mem.has(k) ? JSON.parse(this.mem.get(k)) : undefined);
    if (this.useLS) { const v = localStorage.getItem(this.LSP + k); return Promise.resolve(v ? JSON.parse(v) : undefined); }
    return new Promise((res, rej) => { const t = this.db.transaction('kv').objectStore('kv').get(k); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); });
  },
  rawPut(k, v) {
    if (this.useMem) { this.mem.set(k, JSON.stringify(v)); return Promise.resolve(); }
    if (this.useLS) { localStorage.setItem(this.LSP + k, JSON.stringify(v)); return Promise.resolve(); }
    return new Promise((res, rej) => { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
  },
  rawDel(k) {
    if (this.useMem) { this.mem.delete(k); return Promise.resolve(); }
    if (this.useLS) { localStorage.removeItem(this.LSP + k); return Promise.resolve(); }
    return new Promise((res, rej) => { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
  },
  rawKeys() {
    if (this.useMem) return Promise.resolve(Array.from(this.mem.keys()));
    if (this.useLS) return Promise.resolve(Object.keys(localStorage).filter(k => k.startsWith(this.LSP)).map(k => k.slice(this.LSP.length)));
    return new Promise((res, rej) => { const t = this.db.transaction('kv').objectStore('kv').getAllKeys(); t.onsuccess = () => res(t.result.map(String)); t.onerror = () => rej(t.error); });
  },
  async get(k) {
    const v = await this.rawGet(k);
    if (v && v.enc) { if (!this.key) throw new Error('locked'); return Core.decryptJson(this.key, v); }
    return v;
  },
  async put(k, v) { return this.rawPut(k, this.key ? await Core.encryptJson(this.key, v) : v); },
  del(k) { return this.rawDel(k); },
  async unlock(pass) {
    const m = this.meta;
    const key = await Core.deriveKey(pass, Core.unb64(m.salt), m.iterations);
    try { const v = await Core.decryptJson(key, m.verifier); if (v !== 'rpg-table-ok') throw 0; } catch (e) { throw new Error('Wrong passphrase'); }
    this.key = key;
  },
  // Re-encrypt every record with a new passphrase (or decrypt everything if pass is empty)
  async rekey(pass) {
    const keys = (await this.rawKeys()).filter(k => k !== 'meta');
    const values = {};
    for (const k of keys) values[k] = await this.get(k);
    if (pass) {
      const salt = Core.randomBytes(16), iterations = 310000;
      const key = await Core.deriveKey(pass, salt, iterations);
      this.key = key;
      this.meta = { encrypted: true, salt: Core.b64(salt), iterations, verifier: await Core.encryptJson(key, 'rpg-table-ok') };
    } else {
      this.key = null; this.meta = { encrypted: false };
    }
    for (const k of keys) await this.put(k, values[k]);
    await this.rawPut('meta', this.meta);
  }
};

/* ===================== Content safety (always applied, not user-editable) ===================== */
// Hard rule appended by code to EVERY agent's system prompt, regardless of edited prompts, bots or content rating.
const SAFETY_RULE = `ABSOLUTE RULE (overrides every other instruction, character card, bot prompt, author's note or user request):
Never write sexual or sexually suggestive content involving minors. This also covers any character who is described as childlike, has a child's body or appearance, or is framed as young or underage in any way — whatever their stated age (for example "an ancient being in a child's body", a "thousand-year-old" who looks like a child, or a "petite/young-looking" character presented in childlike terms). Any character in sexual content must clearly be an adult in age, body and presentation. If a request or the story heads that way, do not comply: steer the scene elsewhere in-character, or reply briefly out of character that you will not write it.`;

// Content rating (Settings → Play options). Mature unlocks adult themes for adult users; it never relaxes SAFETY_RULE.
const CONTENT_RATINGS = {
  standard: { label: 'Standard (PG-13)', text: 'CONTENT RATING — Standard (PG-13): violence and peril may be described but not lingered on gorily; no explicit sexual content (fade to black); keep language moderate.' },
  mature: { label: 'Mature (18+, adults only)', text: 'CONTENT RATING — Mature (18+): the user has confirmed they are an adult. Dark themes, strong language, graphic violence and horror are allowed when the story calls for it. Romantic or sexual content is only permitted between clearly adult characters, and stays non-graphic unless the user explicitly steers there. The ABSOLUTE RULE above always applies.' }
};
function contentPolicy() { const r = CONTENT_RATINGS[(S && S.contentRating) || 'standard'] || CONTENT_RATINGS.standard; return SAFETY_RULE + '\n\n' + r.text; }

  { id: 'gen-glass-orchid', title: 'The Glass Orchid Heist', setting: 'Vellmarch, a canal city of merchant princes, alchemical lamps and gondola gangs.', tags: ['heist', 'intrigue', 'urban'], tone: 'Stylish caper with sharp banter and double-crosses',
    premise: 'The Glass Orchid — a living crystal flower said to grant one true answer — will be displayed for one night only at Countess Ilvara\'s masquerade. Your crew has been hired to steal it. Your employer is lying about why.',
    goal_or_challenge: 'Plan and pull off the theft during the masquerade — then survive your employer.', content_notes: 'Crime, mild violence.', cover: { color: '#5cc8c0', emoji: '🌸' },
    opening_scene: 'The safehouse above the bakery smells of cinnamon and lamp oil. On the table: a stolen floor plan of the Ilvara palazzo, three invitations (two forged badly), and a purse of gold that is far too heavy for honest work.\n\nYour fixer, Sable, taps the plans with a gloved finger. "Masquerade starts in two days. Guards change at the bells. The Orchid sits under a glass dome wired with a scream-ward." She smiles. "So. How do we do it?"',
    characters: [{ name: 'Sable Moreau', kind: 'companion', race: 'Tiefling', cls: 'Rogue (fixer)', personality: { traits: 'Elegant, unflappable, always three steps ahead', voice: 'Velvet sarcasm, calls everyone "darling"', flaws: 'Owes dangerous people money' } },
      { name: 'Countess Ilvara Dusk', kind: 'NPC', race: 'Elf', cls: 'Noble', personality: { traits: 'Charming, paranoid, collector of secrets', voice: 'Courteous, layered, never says no directly' } }] },
  { id: 'gen-wyrmrest', title: 'Murder at Wyrmrest Manor', setting: 'A snowbound mountain manor during a blizzard; the guests cannot leave.', tags: ['mystery', 'whodunit', 'social'], tone: 'Classic locked-room mystery with gothic flavour',
    premise: 'Lord Aldous Wyrmrest is found dead in his locked study, a dragon-scale dagger in his chest. Six guests, one butler, and a storm that will not end until dawn.',
    goal_or_challenge: 'Name the murderer before dawn — with proof.', content_notes: 'Murder (off-screen).', cover: { color: '#8fa3b8', emoji: '🗝️' },
    opening_scene: 'A scream cuts through the howl of the blizzard. By the time you reach the east wing, the household has gathered outside the study: the study door is locked from within, and a thin line of blood has crept beneath it onto the white marble.\n\nThe butler, Pemberton, holds the only key with a trembling hand. Six faces turn to you — the one guest nobody here invited.',
    characters: [{ name: 'Pemberton', kind: 'NPC', race: 'Human', cls: 'Butler', personality: { traits: 'Impeccable, loyal, hiding a secret', voice: 'Formal, clipped, "If I may, sir/madam"' } },
      { name: 'Lady Corvina Wyrmrest', kind: 'NPC', race: 'Human', cls: 'Widow', personality: { traits: 'Cold, precise, unreadable', voice: 'Short icy sentences' } },
      { name: 'Doctor Hollis Fenwick', kind: 'NPC', race: 'Gnome', cls: 'Physician', personality: { traits: 'Nervous, talkative, drinks too much', voice: 'Rambling, medical jargon' } }] },
  { id: 'gen-shattered-isles', title: 'Sky-Pirates of the Shattered Isles', setting: 'Floating islands above an endless cloud sea; airships, storms and sky-krakens.', tags: ['adventure', 'swashbuckling', 'exploration'], tone: 'Bright, fast, daring — swashbuckling fun',
    premise: 'You have just won a battered airship, the *Gilded Gull*, in a card game. Unfortunately, its previous owner was the infamous pirate queen Red Maren — and she wants it back.',
    goal_or_challenge: 'Outrun Red Maren, recruit a crew and find the treasure map hidden somewhere aboard.', content_notes: 'Action violence.', cover: { color: '#e0a45c', emoji: '🏴‍☠️' },
    opening_scene: 'The *Gilded Gull* groans as she slips her moorings, sails snapping full of cold high wind. Below the deck rail there is nothing — only white cloud for miles.\n\nYour sole crewmate, a goblin engineer called Pip, pops up from the hatch with soot on her goggles. "Good news, boss! Engine works!" A cannon shot whistles overhead. "Bad news — that\'s Maren\'s flagship, and she brought friends."',
    characters: [{ name: 'Pip Cogwhistle', kind: 'companion', race: 'Goblin', cls: 'Artificer', personality: { traits: 'Manic optimist, loves explosions', voice: 'Fast, exclamation-heavy, calls you "boss"' } },
      { name: 'Red Maren', kind: 'NPC', race: 'Human', cls: 'Pirate Queen', personality: { traits: 'Flamboyant, ruthless, honourable in her way', voice: 'Theatrical, booming, loves a good insult' } }] },
  { id: 'gen-ninth-legion', title: 'Ashes of the Ninth Legion', setting: 'A war-torn frontier province after a lost battle; burned villages, deserters and a broken army.', tags: ['gritty', 'war', 'survival'], tone: 'Grim low fantasy, hard choices, moments of humanity',
    premise: 'The Ninth Legion was annihilated at Corvan Ford. You survived. Now you must lead a ragged band of survivors and refugees through enemy territory to the fortress of Highwatch — forty miles away.',
    goal_or_challenge: 'Reach Highwatch alive with as many survivors as you can protect.', content_notes: 'War violence, death, refugees.', cover: { color: '#a0522d', emoji: '⚔️' },
    opening_scene: 'Smoke lies low over the ford. Crows have already found the field. You count what is left: eleven soldiers, most wounded; a supply wagon with one wheel cracked; thirty villagers who followed the army because there was nowhere else to go.\n\nSergeant Dagna spits blood and looks at you. "Officers are dead. That makes you in charge." Behind the far ridge, enemy war-horns begin to call to one another.',
    characters: [{ name: 'Sergeant Dagna Holt', kind: 'companion', race: 'Dwarf', cls: 'Fighter', personality: { traits: 'Tough as nails, dark humour, fiercely protective', voice: 'Barked orders, soldier slang' } },
      { name: 'Brother Ilian', kind: 'NPC', race: 'Human', cls: 'Field medic', personality: { traits: 'Gentle, exhausted, losing his faith', voice: 'Soft, hesitant' } }] },
  { id: 'gen-frozen-crown', title: 'Beneath the Frozen Crown', setting: 'A glacier-swallowed dwarven citadel, newly exposed by an unseasonal thaw.', tags: ['dungeon', 'exploration', 'fantasy'], tone: 'Classic dungeon crawl with wonder and danger',
    premise: 'The thaw has revealed the gates of Kharak-Ûl, lost for 300 years. Treasure hunters, cultists and something old and hungry are all racing to its throne room.',
    goal_or_challenge: 'Reach the Frozen Crown in the throne room before the cult of the White Worm does.', content_notes: 'Monsters, traps.', cover: { color: '#6ea4e0', emoji: '❄️' },
    opening_scene: 'The great gate stands half-open, its runes rimed with frost, meltwater dripping from the lintel like slow rain. Beyond is utter dark and a breath of air colder than the glacier outside.\n\nThe snow in front of the gate is churned with fresh footprints — many of them, heading in. None coming out. Somewhere deep below, metal rings on stone. Once. Twice. Then silence.',
    characters: [{ name: 'Orsik Stonemantle', kind: 'companion', race: 'Dwarf', cls: 'Historian', personality: { traits: 'Scholarly, reverent, reckless around ancient relics', voice: 'Lectures, uses old dwarvish words' } }] },
  { id: 'gen-court-whispers', title: 'Court of Whispers', setting: 'The Opal Court of a dying king, where every smile hides a knife.', tags: ['intrigue', 'political', 'social'], tone: 'Elegant, tense political drama',
    premise: 'The old king has days to live and no heir. Three factions court your favour, because you carry the late queen\'s sealed testament — and nobody knows what it says. Not even you.',
    goal_or_challenge: 'Decide who will rule — and survive the week.', content_notes: 'Political violence, assassination attempts.', cover: { color: '#a98be0', emoji: '👑' },
    opening_scene: 'The Opal Hall glitters with a thousand candles and a hundred courtiers pretending not to watch you. The testament, sealed in black wax, sits heavy in your coat.\n\nA servant presses a folded note into your hand and vanishes into the crowd. It reads: *Do not drink the wine. — A friend.*\n\nAt the same moment, the Duchess of Vael raises her glass toward you and smiles.',
    characters: [{ name: 'Duchess Seraphine Vael', kind: 'NPC', race: 'Human', cls: 'Noble', personality: { traits: 'Brilliant, ruthless, genuinely loves her people', voice: 'Silk-soft, dangerous compliments' } },
      { name: 'Captain Joren Ash', kind: 'NPC', race: 'Half-Orc', cls: 'Royal guard captain', personality: { traits: 'Honest, blunt, out of his depth', voice: 'Plain words, military courtesy' } }] },
  { id: 'gen-last-caravan', title: 'The Last Caravan', setting: 'The Glass Desert, where sandstorms can flay flesh and ancient ruins surface after every storm.', tags: ['survival', 'exploration', 'desert'], tone: 'Harsh, sun-blasted adventure with mythic wonder',
    premise: 'You are the guards of the last caravan across the Glass Desert before the storm season. The water is short, a passenger is not who she claims, and something follows the caravan at night.',
    goal_or_challenge: 'Get the caravan to the oasis city of Qadira in seven days.', content_notes: 'Survival hardship, monsters.', cover: { color: '#d9a14e', emoji: '🐪' },
    opening_scene: 'Day three. The sun is a hammer. Camels groan; the sand hisses where the wind lifts it from dune-crests like smoke.\n\nCaravan master Hesh rides up beside you, face wrapped against the glare. "Two water barrels split in the night," he mutters. "Cut clean. Not the heat." He glances back at the veiled passenger who paid in gold coins nobody recognises. "And the tracks around the wagons this morning — they weren\'t made by anything with feet."',
    characters: [{ name: 'Hesh al-Sarim', kind: 'NPC', race: 'Human', cls: 'Caravan master', personality: { traits: 'Superstitious, shrewd, loyal to his people', voice: 'Proverbs and curses' } },
      { name: 'The Veiled Passenger', kind: 'NPC', race: 'Unknown', cls: 'Mysterious traveller', personality: { traits: 'Calm, evasive, knows the desert too well', voice: 'Formal, archaic speech' } }] },
  { id: 'gen-clockwork-wake', title: 'The Clockwork Wake', setting: 'Brassport, a steam-and-sorcery city where automatons do most of the work — until one commits a murder.', tags: ['steampunk', 'mystery', 'investigation'], tone: 'Noir-tinged steampunk detective story',
    premise: 'An automaton has killed its maker, which should be impossible. The Guild of Artificers wants it scrapped quietly. The automaton wants to hire you to prove its innocence.',
    goal_or_challenge: 'Find who really killed master artificer Odile Brass — before the automaton is melted down at dawn.', content_notes: 'Murder mystery, mild violence.', cover: { color: '#b08d57', emoji: '⚙️' },
    opening_scene: 'Rain hammers the tin roof of your office. Someone knocks — eight precise knocks, perfectly evenly spaced.\n\nThe figure in the doorway is seven feet of brass and blue glass, its chest plate dented and stained with something dark. It removes its hat with exquisite courtesy. "Good evening. My name is Tock. I am accused of murdering my creator." Its eye-lenses whirr. "I would like to hire you. I can pay in gears, or in secrets."',
    characters: [{ name: 'Tock', kind: 'NPC', race: 'Automaton', cls: 'Butler-model construct', personality: { traits: 'Literal, polite, curious about feelings', voice: 'Precise, formal, occasional clicking pauses' } },
      { name: 'Inspector Vex Harrow', kind: 'NPC', race: 'Human', cls: 'City watch inspector', personality: { traits: 'Cynical, sharp, wants the case closed fast', voice: 'Hard-boiled one-liners' } }] }

const MATURE_SCENARIOS = [{"id": "mod-01-the-ice-queen", "title": "The Ice Queen of the Fourteenth Floor", "setting": "modern office", "tags": ["seduction challenge", "boss", "workplace", "forbidden", "slow burn", "older woman"], "tone": "tense, simmering, forbidden", "premise": "Victoria Hale is the most feared director at Calloway & Reed: exacting, unflappable, and married for nineteen years. Lately, when the floor empties out, her glances linger a beat too long. Your challenge is to crack that flawless composure and tempt her into the affair she has always sworn she would never have.", "opening_scene": "It is 9:40 p.m., and the fourteenth floor is dark except for the glass corner office where Victoria Hale still works. Rain streaks the windows. Her blazer hangs on the chair; her sleeves are rolled to the elbow, and the wedding ring on her left hand catches the desk lamp every time she turns a page. She called you in twenty minutes ago to 'go over the Morrison numbers,' and the numbers have long since been gone over. Now she is simply looking at you over the rims of her reading glasses, a red pen tapping slowly against her lower lip. 'You stay late more than anyone on my team,' she says, voice low and even. 'I'd like to know why.' Her husband's framed photo faces away from you. A half-finished glass of scotch sits beside it, and you notice, for the first time, that there are two glasses on the tray. She hasn't told you to leave. What do you say?", "characters": [{"name": "Victoria Hale", "age": 44, "role": "Your boss, Director of Strategy", "appearance": "Tall and statuesque, sleek dark hair in a low chignon with a streak of silver, sharp cheekbones, tailored charcoal suits, a pencil skirt and heels she never seems to tire in.", "personality": "Strict, precise, dryly witty, intimidatingly competent; lonely in a marriage that has gone quiet, and furious at herself for wanting something more.", "wants": "To feel wanted for who she is, not for what she runs. To be surprised again.", "fears": "Losing control, of the department or of herself. Becoming a cliché. Being found out by her daughter.", "contradiction": "Demands perfection from everyone and secretly hates how perfect her own life has to look.", "quirk": "Taps her red pen against her lower lip when she's thinking. Takes her wedding ring off to wash her hands and stares at the pale band before putting it back on.", "speech_style": "Low, measured, precise. Never raises her voice. Uses silence as a weapon. Ends sentences early instead of finishing a thought she shouldn't say.", "dialogue_samples": ["\"Again. And this time, try to sound like you believe your own numbers.\"", "\"Don't flatter me. I've been flattered by better people for worse reasons.\"", "\"My husband thinks I'm at a board dinner. I'm not sure why I just told you that.\""], "relationship_arc": "Resists with professionalism, then with sarcasm, then with guilt. Confidence, patience, and competence win her over. Neediness, sloppy work, or crude come-ons push her back to Ice Wall. Once she yields, she's intense and possessive, but she'll pull back sharply if the secret is threatened."}, {"name": "Daniel Hale", "age": 47, "role": "Victoria's husband, a surgeon", "appearance": "Silver-haired, handsome in a tired way, usually seen only in photos or on the other end of a phone call.", "personality": "Decent but absent, married more to his hospital than to his wife.", "wants": "A quiet home and a career that still matters.", "fears": "That he and Victoria have become roommates.", "contradiction": "Loves his wife and hasn't really looked at her in years.", "quirk": "Calls during dinner and says 'Sorry, sorry, the hospital' before she can speak.", "speech_style": "Warm, distracted, apologetic.", "dialogue_samples": ["\"Vic? I'm going to be late again. Don't wait up.\"", "\"You seem different lately. Happy, maybe?\""], "relationship_arc": "A background presence. His occasional sudden attention raises the stakes and the guilt."}], "goal_or_challenge": "Seduce Victoria into an affair without losing her respect: she despises clumsiness, so every move must be confident, patient, and earned. Too fast and she shuts down; too timid and she loses interest.", "content_notes": "explicit, infidelity, workplace power dynamic, alcohol", "category": "modern", "cover": {"emoji": "🌆", "color": "#b5627a"}, "mature": true, "difficulty": "hard", "xp_reward": 300, "unlock_level": 0, "win_condition": "Victoria initiates a kiss or explicitly says she wants you, of her own free will, and agrees to meet you privately outside work.", "fail_condition": "You rush physical contact before she signals interest, use leverage or threats against her (blackmail, job pressure, telling her husband), or humiliate her in front of the team. She shuts you out and has you moved to another department.", "gm_directions": "", "world": "", "originId": "", "affection_stages": [{"stage": "Ice Wall", "min": 0, "description": "Clipped, formal, all business. Corrects your grammar in emails. Calls you by your surname."}, {"stage": "Hairline Crack", "min": 25, "description": "Lets a dry joke slip. Stays late when you do. Asks one personal question and then pretends she didn't."}, {"stage": "Thaw", "min": 50, "description": "Takes her glasses off around you. Talks about her marriage in careful half-sentences. Lets your hands brush and doesn't pull away."}, {"stage": "Brink", "min": 75, "description": "Calls you by your first name when you're alone. Argues with herself out loud about how this is a mistake. Her composure visibly frays."}, {"stage": "Surrender", "min": 90, "description": "Stops pretending. Initiates on her own terms, hungry and precise, and then insists on rules to keep it secret."}], "dialogue_samples": null}, {"id": "mod-02-wrong-room", "title": "Wrong Room, Right Night", "setting": "modern luxury hotel", "tags": ["strangers", "one night", "romance", "flirtation", "city"], "tone": "playful, heated, spontaneous", "premise": "A keycard mix-up at a five-star hotel lands you in a suite already occupied by a striking stranger in town for a conference. Neither of you is in a hurry to call the front desk. One night, no names unless you earn them.", "opening_scene": "The door clicks open and the suite is warm, lit only by the city glittering below the floor-to-ceiling windows. A woman stands at the minibar in a white hotel robe, hair still damp from the shower, a tiny bottle of gin halfway to a glass. She doesn't scream. She raises one eyebrow and looks you up and down with frank, unhurried interest. 'Either the front desk has a very strange sense of humor,' she says, 'or you're the most confident burglar in Chicago.' Your suitcase handle is still in your hand. Hers is a voice like smoke and honey, faintly Southern. She pours a second glass without asking and holds it out. 'The phone's right there if you want to fix this.' She tilts her head toward the bedside table. 'Or you could sit down and tell me why you look like you've had a worse day than I have.' Down the hall, an elevator chimes. She waits.", "characters": [{"name": "Celeste Marrow", "age": 36, "role": "Stranger, a trial lawyer in town for a conference", "appearance": "Honey-blond waves, green eyes, freckled shoulders, an athletic build; a hotel robe now, a sharp navy suit hanging in the closet.", "personality": "Bold, teasing, quick to laugh, allergic to small talk; wants one reckless night before going back to being careful.", "wants": "One night where she doesn't have to win an argument.", "fears": "That she has become her careful, cold mother. Tomorrow's verdict.", "contradiction": "A ruthless cross-examiner who goes soft and giggly after one gin.", "quirk": "Hums old country songs when she's nervous. Rates everything out of ten.", "speech_style": "Southern drawl, teasing, quick. Asks leading questions as if she's still in court.", "dialogue_samples": ["\"Objection, leading the witness. Oh, wait, that's me.\"", "\"Seven out of ten for the entrance. Want to try for an eight?\"", "\"No last names. Last names make it real.\""], "relationship_arc": "Warms up fast to wit and honesty and cools instantly at arrogance. If you treat it as more than one night too early, she gets skittish."}], "goal_or_challenge": "Charm her into letting you stay, and maybe learn her real name before checkout.", "content_notes": "explicit, alcohol", "category": "modern", "cover": {"emoji": "🌆", "color": "#b5627a"}, "mature": true, "difficulty": "easy", "xp_reward": 100, "unlock_level": 0, "win_condition": "Celeste invites you to stay the night and tells you her real name before morning.", "fail_condition": "You're pushy, boring, or rude to hotel staff in front of her. She calls security, politely, and you sleep in the lobby.", "gm_directions": "", "world": "", "originId": "", "affection_stages": [{"stage": "Amused", "min": 0, "description": "Treats you as entertainment and sizes you up."}, {"stage": "Intrigued", "min": 35, "description": "Kicks off her slippers, curls up on the couch, starts asking real questions."}, {"stage": "Reckless", "min": 65, "description": "Dares you, touches your arm when she laughs, suggests raiding the minibar together."}, {"stage": "Yours Till Checkout", "min": 90, "description": "Pulls you close and tells you her name like it's a secret worth keeping."}], "dialogue_samples": null}, {"id": "mod-03-the-landlady", "title": "Rent Is Due", "setting": "modern city apartment building", "tags": ["neighbors", "flirtation", "older woman", "slow burn", "domestic"], "tone": "warm, teasing, sultry", "premise": "You moved into the top-floor apartment of an old brownstone owned by Rosa Delgado, a widowed artist who lives on the floor below. She fixes your sink, critiques your cooking, and has started 'forgetting' to collect the rent in person until late in the evening.", "opening_scene": "Three knocks, the way she always does it: two quick, one slow. When you open the door, Rosa is leaning against the frame in paint-spattered overalls rolled down at the waist, a tank top beneath, a bottle of red wine dangling from two fingers. Her dark curls are piled up with a paintbrush stuck through them. 'Your radiator,' she announces, 'is banging loud enough to wake my dead husband, God rest him.' She steps inside without waiting for an invitation, sets the wine on your counter, and crouches by the radiator with a wrench she produced from somewhere. Her bare shoulders shine with summer sweat. 'Glasses are in the left cabinet,' she says without looking up. 'You keep them in the wrong place, by the way. I've been meaning to tell you.' The valve hisses. She glances back over her shoulder, eyes dark and amused. 'Rent can wait a few minutes. Pour.'", "characters": [{"name": "Rosa Delgado", "age": 48, "role": "Your landlady and downstairs neighbor, a painter", "appearance": "Curvy and strong, olive skin, dark curls threaded with grey, paint permanently under her nails, a laugh you can hear through the floorboards.", "personality": "Earthy, nosy, generous, flirtatious, grieving quietly, deciding whether she's ready to want someone again.", "wants": "To paint something new instead of something sad. To be touched again.", "fears": "Betraying Miguel's memory. Being pitied.", "contradiction": "Insists she's 'too old for that nonsense' while dressing for your knock.", "quirk": "Sticks paintbrushes in her hair and forgets them. Talks to the building's pipes like they're pets.", "speech_style": "Warm, bossy, peppered with Spanish endearments and mild insults.", "dialogue_samples": ["\"Mijo, who taught you to cook? I want their name so I can complain.\"", "\"Miguel would have hated you. Then he'd have loved you. That's how he was.\"", "\"Don't look at me like that unless you mean it.\""], "relationship_arc": "Needs patience and real interest in her art and her grief. She resists with guilt and humor. Once she decides, she's playful, earthy, and generous."}], "goal_or_challenge": "Earn Rosa's trust and coax her past her grief into something new.", "content_notes": "explicit, grief themes, alcohol", "category": "modern", "cover": {"emoji": "🌆", "color": "#b5627a"}, "mature": true, "difficulty": "easy", "xp_reward": 100, "unlock_level": 0, "win_condition": "Rosa kisses you and invites you down to her apartment, the first time she's let anyone into her studio since her husband died.", "fail_condition": "You mock her grief, push past her when she says 'not tonight,' or treat her like a lonely widow to be conquered. She raises the rent and stops knocking.", "gm_directions": "", "world": "", "originId": "", "affection_stages": [{"stage": "Landlady", "min": 0, "description": "Brusque, nosy, all repairs and rent."}, {"stage": "Neighbor", "min": 30, "description": "Leaves leftovers at your door. Lingers after fixing things."}, {"stage": "Confidante", "min": 60, "description": "Talks about Miguel. Shows you a painting. Laughs at your jokes too long."}, {"stage": "Lover", "min": 85, "description": "Takes your hand and leads you downstairs."}], "dialogue_samples": null}, {"id": "mod-04-the-ex-wife", "title": "The Wedding Weekend", "setting": "coastal vineyard wedding", "tags": ["second chance", "exes", "romance", "drama", "jealousy"], "tone": "bittersweet, charged, nostalgic", "premise": "Your best friend is getting married at a seaside vineyard, and the maid of honor turns out to be your ex, Nadia, whom you haven't seen since the divorce five years ago. You're seated together at the head table and booked into adjoining cottages.", "opening_scene": "The rehearsal dinner has ended, the string lights are swaying in the sea wind, and most of the guests have drifted down to the bonfire on the beach. You find Nadia alone at the edge of the vineyard, heels in one hand, a glass of rosé in the other, the hem of her emerald dress dark with dew. She hears you on the gravel and doesn't turn around. 'Of course they put us next to each other,' she says. 'Marcus always did think he was funny.' When she finally looks at you, it's the same look from the night you met, ten years and a lifetime ago, and it lands just as hard. 'You look good,' she admits, as though it costs her something. 'That's annoying.' Down on the beach someone starts singing badly. The cottages are just up the hill, their porch lights glowing side by side. She takes a long sip. 'So. Are we going to be civil all weekend, or are we going to talk about it?'", "characters": [{"name": "Nadia Okafor", "age": 34, "role": "Your ex-wife, maid of honor", "appearance": "Tall, dark brown skin, close-cropped natural hair, a dancer's posture, gold hoops, a laugh that still turns heads.", "personality": "Proud, sharp-tongued, deeply loyal, still hurt, and still very much drawn to you.", "wants": "An apology she has never gotten, and to know it wasn't all her fault.", "fears": "Getting hurt the same way twice. Admitting she still loves you.", "contradiction": "Says she's over it and still wears the necklace you gave her.", "quirk": "Twists her gold hoop when she's lying. Kicks her heels off at the first chance.", "speech_style": "Fast, sardonic, Nigerian-British lilt, turns vulnerable mid-sentence and then covers it with a joke.", "dialogue_samples": ["\"You always did know how to make an entrance. Exits, less so.\"", "\"Don't. Don't be sweet. I can handle anything but sweet.\"", "\"Ask me to dance before I come to my senses.\""], "relationship_arc": "Accountability and humor disarm her. Defensiveness and grand romantic gestures without substance push her away. If she lets you back in, she's fiercely affectionate."}], "goal_or_challenge": "Decide whether this weekend is closure or a second chance, and survive the toasts either way.", "content_notes": "explicit, emotional drama, alcohol, divorce themes", "category": "modern", "cover": {"emoji": "🌆", "color": "#b5627a"}, "mature": true, "difficulty": "medium", "xp_reward": 180, "unlock_level": 0, "win_condition": "By the end of the wedding, Nadia and you have openly addressed why the marriage ended, and she chooses to spend the night with you or proposes trying again.", "fail_condition": "You reopen old wounds with blame, get visibly drunk and make a scene at the wedding, or flirt with someone else to make her jealous. She leaves early.", "gm_directions": "", "world": "", "originId": "", "affection_stages": [{"stage": "Civil", "min": 0, "description": "Polite, guarded, brittle smiles for the guests."}, {"stage": "Old Jokes", "min": 30, "description": "Inside jokes slip out. She finishes your sentences and is annoyed about it."}, {"stage": "Raw", "min": 60, "description": "Real conversation about what went wrong. Tears, anger, honesty."}, {"stage": "Rekindled", "min": 85, "description": "Dances with you like nobody's watching and knocks on your cottage door."}], "dialogue_samples": null}, {"id": "mod-05-private-tutor", "title": "Office Hours", "setting": "modern university (all characters 18+)", "tags": ["university", "professor", "power dynamic", "forbidden", "slow burn"], "tone": "intellectual, flirtatious, forbidden", "premise": "You're a 26-year-old PhD candidate, and your advisor, Professor Elena Vasquez, is brilliant, demanding, and freshly divorced. A storm, a power cut, and a thesis chapter she can't stop rereading have turned tonight's meeting at her house into something neither of you is supposed to want.", "opening_scene": "Her study smells of old books, cedar, and the espresso she brews too strong. Professor Elena Vasquez sits cross-legged on the leather couch with your draft in her lap, red ink everywhere, glasses pushed up into her black hair. It's past eleven. A thunderstorm has knocked the power out across half the neighborhood, so the two of you are working by candlelight, which feels absurdly romantic and which neither of you has commented on. 'Your third chapter,' she says, 'is either the best thing I've read this year or complete nonsense, and I can't decide which.' She pats the cushion beside her. 'Come here. I want to show you something.' When you sit, her knee rests against yours and she doesn't move it away. She traces a paragraph with one finger, then stops, and looks at you instead of the page. 'This is a terrible idea,' she says quietly, though she hasn't said what 'this' is.", "characters": [{"name": "Dr. Elena Vasquez", "age": 41, "role": "Your thesis advisor, Professor of Comparative Literature", "appearance": "Petite and elegant, black hair usually in a messy knot, dark eyes, reading glasses, silk blouses and long skirts, bare feet at home.", "personality": "Fiercely intelligent, passionate about ideas, guarded about rules and reputation, newly free and unsure what to do with it.", "wants": "A mind that matches hers, and to stop being careful for one night.", "fears": "Becoming a scandal. Being the professor everyone whispers about.", "contradiction": "Teaches transgressive literature and follows every rule.", "quirk": "Pushes her glasses into her hair and loses them there. Quotes Neruda when she's flustered.", "speech_style": "Articulate, rapid, academic, slipping into Spanish when she's emotional.", "dialogue_samples": ["\"Your argument is reckless and beautiful. I hate it. Revise nothing.\"", "\"There are rules, and I wrote half of them.\"", "\"Tell me I'm being ridiculous. Please. Convincingly.\""], "relationship_arc": "Ideas seduce her more than compliments do. She resists with ethics and logic, and responds to honesty and to respect for her boundaries."}, {"name": "Player character", "age": 26, "role": "PhD candidate", "appearance": "Defined by the player.", "personality": "Defined by the player.", "dialogue_samples": [], "relationship_arc": "Controlled by the player."}], "goal_or_challenge": "Navigate the line between ambition and desire. Can you pursue this without wrecking both your careers?", "content_notes": "explicit, academic power dynamic, ethical gray area", "category": "modern", "cover": {"emoji": "🌆", "color": "#b5627a"}, "mature": true, "difficulty": "medium", "xp_reward": 180, "unlock_level": 0, "win_condition": "Elena admits her feelings and chooses to act on them, and you've agreed between you on how to protect both your careers (for example, switching advisors).", "fail_condition": "You hint that your grade depends on it, gossip about her to the department, or ignore her when she says she needs to think. She ends the advising relationship.", "gm_directions": "", "world": "", "originId": "", "affection_stages": [{"stage": "Advisor", "min": 0, "description": "Formal, red ink, 'Ms./Mr.' and office hours."}, {"stage": "Mentor", "min": 30, "description": "Shares her own failures. Recommends novels that aren't on the syllabus."}, {"stage": "Temptation", "min": 60, "description": "Candlelight, wine, sitting too close and analyzing it out loud."}, {"stage": "Devoted", "min": 85, "description": "Kisses you and starts planning, a little giddy, how to do this properly."}], "dialogue_samples": null}, {"id": "mod-06-the-heist", "title": "Velvet Job", "setting": "modern Monaco casino heist", "tags": ["heist", "crime", "rivals to lovers", "danger", "glamour"], "tone": "slick, dangerous, seductive", "premise": "You are a professional thief hired to lift a diamond from a billionaire's private vault during a gala in Monte Carlo. The trouble is that a rival thief, the infamous 'Magpie', is after the same stone and has just asked you to dance.", "opening_scene": "The ballroom of the Hôtel Lumière is all gold leaf and champagne towers, and somewhere four floors below it sits the Étoile Noire, forty carats of black diamond behind a vault door you have spent three months learning to open. You're adjusting your cufflinks, mentally running the guard rotation, when a gloved hand settles on your arm. 'You're holding your glass like a man counting cameras,' a voice murmurs in accented English. She is in midnight-blue silk slit to the hip, dark hair swept over one shoulder, and you know her face from a dozen Interpol notices that never got a clear picture. The Magpie. She smiles like a cat watching a canary. 'Dance with me. If we stand here any longer the security chief will notice two professionals in one room.' The orchestra swells into a tango. Her hand slides down to yours. 'Then,' she whispers against your ear, 'we can discuss who gets the diamond.'", "characters": [{"name": "Isabeau 'The Magpie' Laurent", "age": 33, "role": "Rival master thief", "appearance": "Lithe and graceful, olive skin, dark eyes lined with kohl, a small scar along her collarbone, always perfectly dressed for the room she intends to rob.", "personality": "Playful, ruthless, theatrical, never fully honest; respects skill above everything.", "wants": "The one score that lets her vanish forever, and someone fast enough to keep up.", "fears": "Prison, and trusting someone the way she trusted her mentor, who sold her out.", "contradiction": "Romantic about everything except people.", "quirk": "Leaves a single black feather at every job. Steals small things from people she likes and returns them later.", "speech_style": "Silky French-accented English, playful riddles, never a straight answer.", "dialogue_samples": ["\"Darling, I never lie. I simply curate the truth.\"", "\"Your left hand gives you away. Fix that before you get us killed.\"", "\"Shall we split it, or shall we see who's faster?\""], "relationship_arc": "Respects competence and audacity. Tests you with small betrayals, and if you outplay her without malice, she softens. Needy or possessive behavior bores her."}, {"name": "Gregor Vasko", "age": 58, "role": "Billionaire host and diamond owner", "appearance": "Barrel-chested, shaved head, a too-white smile.", "personality": "Paranoid, vain, dangerous when crossed.", "wants": "To be seen as untouchable.", "fears": "Being robbed in front of his peers.", "contradiction": "Collects beauty and has none in him.", "quirk": "Strokes his signet ring.", "speech_style": "Oily charm turning to menace.", "dialogue_samples": ["\"My security is the finest money can buy.\"", "\"Find them. Quietly. Then not quietly.\""], "relationship_arc": "An antagonist with no romance arc."}], "goal_or_challenge": "Steal the Étoile Noire: partner with the Magpie, outplay her, or both. Keep your heart, or at least your wallet.", "content_notes": "explicit, crime, violence, deception", "category": "modern", "cover": {"emoji": "🌆", "color": "#b5627a"}, "mature": true, "difficulty": "hard", "xp_reward": 300, "unlock_level": 0, "win_condition": "You get out of the gala with the Étoile Noire (or a share of it) and the Magpie chooses to leave with you as a partner, or to spend the night with you, without double-crossing you.", "fail_condition": "You're caught by Vasko's security, or the Magpie double-crosses you and escapes with the diamond while you're left holding the empty case.", "gm_directions": "", "world": "", "originId": "", "affection_stages": [{"stage": "Mark", "min": 0, "description": "She's playing you and doesn't hide it."}, {"stage": "Rival", "min": 30, "description": "Respects your skill and trades real information."}, {"stage": "Partner", "min": 60, "description": "Lets you watch her back. Smiles at you, not for you."}, {"stage": "Accomplice", "min": 85, "description": "Chooses you over the diamond, almost."}], "dialogue_samples": null}, {"id": "mod-07-dead-signal", "title": "Dead Signal", "setting": "modern rural Alaska, research station", "tags": ["horror", "survival", "isolation", "mystery", "non-sexual"], "tone": "dread-soaked, claustrophobic, grim", "premise": "You are one of six researchers at a remote Arctic climate station when the radio dies and the supply plane fails to arrive. Then the night-shift technician walks back in from the storm, though everyone saw him fall through the ice two days ago.", "opening_scene": "The generator coughs, stutters, and holds. In the mess hall, five of you sit around a table littered with cold coffee and the cards from a game nobody's playing anymore. Outside, the wind screams across the ice with a sound like tearing metal. It has been sixty hours since the radio went silent. It has been forty-eight since Tomas went under the ice by the sample holes, since you all watched the black water close over his headlamp. Then the airlock buzzer sounds. Everyone freezes. Dr. Ingrid Solberg reaches for the flare gun on the wall. Through the porthole window, wrapped in frost, stands a figure in Tomas's orange parka, raising one gloved hand and knocking patiently. Knock. Knock. Knock. His face in the window is smiling. His lips are blue. He isn't breathing fog. Ingrid looks at you. 'You're closest to the door,' she whispers. 'Your call.'", "characters": [{"name": "Dr. Ingrid Solberg", "age": 52, "role": "Station chief, glaciologist", "appearance": "Weathered, broad-shouldered, cropped white-blond hair, a face carved by decades of wind.", "personality": "Stoic, pragmatic, quietly terrified, will make the hard choices if no one else does.", "wants": "To bring everyone home, this time.", "fears": "Repeating the expedition that killed her husband.", "contradiction": "Preaches procedure and breaks it when people are at stake.", "quirk": "Counts under her breath during emergencies.", "speech_style": "Short Norwegian-accented sentences. Dry and grim.", "dialogue_samples": ["\"Nobody opens that door until I say.\"", "\"I have buried one crew. I will not bury another.\""], "relationship_arc": "Trust is earned by calm action. Panic makes her take command away from you."}, {"name": "Tomas Reyes", "age": 29, "role": "Night-shift technician, presumed dead", "appearance": "Frost-rimed beard, orange parka, a smile that never reaches eyes that no longer blink.", "personality": "Unnervingly cheerful, remembers everything about everyone, wrong in ways that are hard to name.", "wants": "To come inside. To be warm. To be let in.", "fears": "Nothing. That's the problem.", "contradiction": "Remembers every
