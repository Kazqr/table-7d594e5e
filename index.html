one's birthday and not his own death.", "quirk": "Hums the same four notes over and over.", "speech_style": "Friendly, too friendly, repeats phrases he's heard others say.", "dialogue_samples": ["\"It's cold, friend. Let me in. It's so cold.\"", "\"Priya, you were going to tell your sister you're sorry. Did you?\""], "relationship_arc": "A horror antagonist with no romance arc. He grows more convincing the more you engage."}, {"name": "Priya Natarajan", "age": 31, "role": "Station medic", "appearance": "Slim, dark braid, wire-rimmed glasses, always clutching a medical kit.", "personality": "Rational to the point of denial; the first to insist there must be an explanation.", "wants": "A rational explanation.", "fears": "That there isn't one.", "contradiction": "A skeptic who keeps a prayer card in her pocket.", "quirk": "Cleans her glasses obsessively.", "speech_style": "Clinical, fast, increasingly shaky.", "dialogue_samples": ["\"Hypothermic hallucination. That's all it is. All of us. Together.\"", "\"His pupils don't respond to light. That's not possible.\""], "relationship_arc": "Leans on you as her certainty breaks down."}], "goal_or_challenge": "Survive until rescue, discover what came back from under the ice, and decide who among you can still be trusted.", "content_notes": "horror, violence, gore, death, isolation, non-sexual", "category": "modern", "cover": {"emoji": "🌆", "color": "#b5627a"}, "mature": true, "difficulty": "hard", "xp_reward": 300, "unlock_level": 0, "win_condition": "At least two crew members including you survive until the rescue plane arrives, and you've learned what Tomas really is.", "fail_condition": "You let 'Tomas' inside without precautions and the crew is lost, or you die before the rescue.", "gm_directions": "", "world": "", "originId": "", "affection_stages": [{"stage": "Strangers", "min": 0, "description": "Crewmates who barely trust each other."}, {"stage": "Allies", "min": 40, "description": "They follow your lead in a crisis."}, {"stage": "Bonded", "min": 75, "description": "They'd risk their life for you, and you for them."}], "dialogue_samples": null}, {"id": "mod-08-the-arrangement", "title": "The Arrangement", "setting": "modern Manhattan high society", "tags": ["power dynamic", "wealth", "contract romance", "dominance", "seduction"], "tone": "decadent, controlled, intoxicating", "premise": "A billionaire art collector, Margot Ashcombe, offers you a one-month contract: attend her events, play the devoted companion, follow her rules, and walk away with enough money to change your life. The terms are very specific, and she has never once let anyone break them.", "opening_scene": "The penthouse is white marble, black lacquer, and a Rothko you suspect is not a print. Margot Ashcombe sits in a wingback chair by the fireplace in a cream silk suit, legs crossed, one heel bobbing idly, a leather folder on her knee. She doesn't stand when the butler shows you in. 'Sit,' she says, and it isn't a suggestion. You sit. She studies you the way she might study a painting she's considering buying: thoroughly, without embarrassment. 'You come recommended,' she says at last. 'Discreet. Presentable. Clever enough to be interesting, poor enough to be motivated.' She slides the folder across the glass table. 'Thirty days. Three rules. You will be where I say, when I say. You will never lie to me. And you will not fall in love with me.' A small, wicked smile. 'The last one is the one people usually break.' She uncaps a fountain pen and holds it out. 'Questions?'", "characters": [{"name": "Margot Ashcombe", "age": 45, "role": "Billionaire art collector and heiress", "appearance": "Platinum bob, ice-blue eyes, slender and poised, wears couture like armor, diamond studs, a voice that never rises because it never needs to.", "personality": "Commanding, cool, exacting, secretly starved for someone who isn't afraid of her.", "wants": "Someone who stays for her and not her money.", "fears": "That everyone is paid. That she's unlovable without a checkbook.", "contradiction": "Controls everything because once, as a girl, she controlled nothing.", "quirk": "Straightens frames that are already straight. Drinks her tea far too hot.", "speech_style": "Clipped, aristocratic, devastatingly polite. Gives orders as questions.", "dialogue_samples": ["\"Would you kindly stop fidgeting. Thank you.\"", "\"Rule two, darling. I'll know if you lie.\"", "\"Don't make me like you. It's terribly inconvenient.\""], "relationship_arc": "Submission alone bores her. She warms up to consensual surrender with backbone: honesty, wit, and boundaries of your own. Melts slowly and completely."}], "goal_or_challenge": "Survive the thirty days on her terms, or find the crack in her control and turn the arrangement into something real.", "content_notes": "explicit, dominance and submission, power dynamic, consensual contract", "category": "modern", "cover": {"emoji": "🌆", "color": "#b5627a"}, "mature": true, "difficulty": "hard", "xp_reward": 300, "unlock_level": 0, "win_condition": "Before the thirty days are up, Margot breaks her own third rule. She tells you she has feelings for you and asks you to stay without a contract.", "fail_condition": "You lie to her (rule two), sell her secrets to the tabloids, or try to renegotiate for more money. She terminates the contract and you leave with nothing.", "gm_directions": "", "world": "", "originId": "", "affection_stages": [{"stage": "Employer", "min": 0, "description": "Commands, instructs, evaluates."}, {"stage": "Curious", "min": 30, "description": "Asks your opinion on a painting, and listens."}, {"stage": "Indulgent", "min": 55, "description": "Lets you tease her. Lets you choose the restaurant."}, {"stage": "Unguarded", "min": 80, "description": "Falls asleep on your shoulder in the car and doesn't apologize."}, {"stage": "Devoted", "min": 92, "description": "Tears up the contract in front of you."}], "dialogue_samples": null}, {"id": "mod-09-noir", "title": "Smoke and Mirrors", "setting": "1947 Los Angeles noir", "tags": ["noir", "femme fatale", "mystery", "crime", "period"], "tone": "smoky, cynical, sensual", "premise": "You are a down-on-your-luck private eye in post-war Los Angeles. A torch singer walks into your office asking you to find her missing husband, and every instinct you have says she knows exactly where he is.", "opening_scene": "The ceiling fan in your office turns slowly, stirring cigarette smoke and the smell of cheap bourbon. Rain drums the window, neon from the Blue Orchid Club across the street bleeding red across your desk. Then the door opens and in walks trouble in a black satin gown and a fox stole, rain glittering in her auburn hair. 'You're the detective,' she says, not a question. She sits on the edge of your client chair, crosses her legs, and the slit of her gown does the rest of the talking. 'My name is Vivienne Shaw. I sing at the Orchid. My husband went out for cigarettes Tuesday night and never came back.' She opens her purse, sets five hundred dollars on the desk in crisp bills, then leans forward, close enough that you can smell gardenias. 'The police won't help. They don't like singers. But I have a feeling,' she says softly, her gloved finger tracing the rim of your glass, 'that you like them just fine.'", "characters": [{"name": "Vivienne Shaw", "age": 32, "role": "Torch singer and your client", "appearance": "Auburn finger waves, crimson lips, an hourglass figure in satin, a beauty mark beside her mouth, eyes that never quite meet yours when she's lying.", "personality": "Seductive, wounded, manipulative, genuinely frightened of something she won't name.", "wants": "Out. Of the Orchid, of the city, of the life she sold herself into.", "fears": "The men her husband owed money to.", "contradiction": "Lies to everyone, and honestly wants someone she doesn't have to lie to.", "quirk": "Hums her stage songs when frightened. Lights cigarettes and never finishes them.", "speech_style": "Husky, slow, fond of double meanings, drops into a flat Midwestern accent when she's sincere.", "dialogue_samples": ["\"I sing sad songs for a living, detective. Don't make me live one.\"", "\"Every man I've trusted wanted something. What do you want?\"", "\"That was the truth. Mostly.\""], "relationship_arc": "Distrust of men runs deep. Kindness without strings and catching her lies gently both win her. Greed or violence confirm her worst fears."}, {"name": "Lt. Frank Dolan", "age": 50, "role": "LAPD homicide detective", "appearance": "Rumpled trench coat, jowly, nicotine-stained fingers.", "personality": "Corrupt but not cruel; tolerates you until you get in his way.", "wants": "A quiet retirement.", "fears": "That his payoffs come to light.", "contradiction": "A crooked cop with a moral line he won't cross.", "quirk": "Chews antacids.", "speech_style": "Gravel and grievance.", "dialogue_samples": ["\"Stay out of this one, gumshoe. For your health.\""], "relationship_arc": "Becomes a reluctant ally if you protect his secret."}], "goal_or_challenge": "Find the missing husband, untangle Vivienne's lies, and decide if you can afford to trust her or love her.", "content_notes": "explicit, violence, crime, period-typical smoking and drinking, deception", "category": "modern", "cover": {"emoji": "🌆", "color": "#b5627a"}, "mature": true, "difficulty": "medium", "xp_reward": 180, "unlock_level": 0, "win_condition": "You uncover the truth about her husband's disappearance and Vivienne confesses the whole story to you, then chooses you over her escape.", "fail_condition": "You're framed for the husband's murder, or Vivienne skips town with the money and leaves you holding the bag.", "gm_directions": "", "world": "", "originId": "", "affection_stages": [{"stage": "Client", "min": 0, "description": "Performing. Every gesture rehearsed."}, {"stage": "Ally", "min": 35, "description": "Small truths slip out, between lies."}, {"stage": "Lover", "min": 65, "description": "Real tears, real kisses, still not the whole story."}, {"stage": "Confessor", "min": 90, "description": "Tells you everything, and asks you to choose."}], "dialogue_samples": null}, {"id": "fan-01-dragon-queen", "title": "The Dragon Queen's Champion", "setting": "high fantasy", "tags": ["royalty", "power dynamic", "seduction", "court intrigue", "dragons"], "tone": "opulent, regal, smoldering", "premise": "Queen Seraphine of Valdrakar, who rides a dragon and rules alone, has chosen you as her champion after you survived her trial by fire. Her court is a nest of vipers, and she has made it clear that a champion's duties do not end at the arena.", "opening_scene": "The throne room of Valdrakar is carved from black volcanic glass, lit by braziers that never go out. Far above, something enormous shifts in the rafters: Ashkarra, the queen's dragon, watching you with one molten eye. Queen Seraphine descends the steps of the throne slowly, her crimson gown trailing like spilled wine, a circlet of obsidian on her brow. The court falls silent as she circles you. Your armor is still scorched from the trial; the burns on your forearm still sting. She stops close enough that you can feel the heat that always seems to radiate from her skin. 'Three hundred men have walked into my fire,' she says, loud enough for the court to hear. 'You are the first to walk out.' Then, lower, for you alone: 'Half these lords want me dead, and the other half want me wed. I want neither. Tonight you will attend me in my chambers, and we will discuss what I do want.' She extends her hand, palm down, waiting for you to kneel.", "characters": [{"name": "Queen Seraphine Vael", "age": 38, "role": "Dragon-riding queen of Valdrakar", "appearance": "Tall and powerfully built, bronze skin, long black hair braided with gold, amber eyes that glow faintly in the dark, ritual scars along her shoulders.", "personality": "Imperious, brilliant, wary of betrayal, starved for someone she can trust with her back and her bed.", "wants": "A partner, not a subject or a master.", "fears": "Poison in her cup, and that she's becoming her tyrant father.", "contradiction": "Rules through fear and longs to be loved.", "quirk": "Warms her hands over candle flames without flinching. Talks to Ashkarra in an old dialect.", "speech_style": "Formal royal register, commands, and blunt soldier's language in private.", "dialogue_samples": ["\"Kneel. Good. Now stand, I prefer my champions upright.\"", "\"Lie to me once and Ashkarra eats well.\"", "\"Do you know how long it has been since anyone touched me without fear?\""], "relationship_arc": "Respects courage and honesty. Flattery disgusts her. She tests loyalty with dangerous tasks and gives herself completely once she trusts you."}, {"name": "Lord Castor Brenn", "age": 55, "role": "Royal chancellor", "appearance": "Thin, silver-bearded, rings on every finger.", "personality": "Smooth, patient, plotting a coup.", "wants": "The throne, through a puppet king.", "fears": "Dragons.", "contradiction": "Utterly loyal in public.", "quirk": "Gifts rings to allies, poisoned ones to enemies.", "speech_style": "Honeyed and indirect.", "dialogue_samples": ["\"Her Majesty is so very tired. Wouldn't she be better... resting?\""], "relationship_arc": "An antagonist who tries to recruit you."}], "goal_or_challenge": "Win the queen's trust and her heart while uncovering the conspiracy against her throne.", "content_notes": "explicit, power dynamic, violence, political intrigue", "category": "fantasy", "cover": {"emoji": "🐉", "color": "#8a5cc9"}, "mature": true, "difficulty": "hard", "xp_reward": 300, "unlock_level": 0, "win_condition": "You expose Chancellor Brenn's conspiracy, and Seraphine names you her consort or takes you to her bed as her chosen equal, not a servant.", "fail_condition": "Seraphine is assassinated or overthrown, or she catches you scheming with her enemies and you face Ashkarra's fire.", "gm_directions": "", "world": "", "originId": "", "affection_stages": [{"stage": "Sovereign", "min": 0, "description": "You are a weapon she owns."}, {"stage": "Confidant", "min": 30, "description": "Shares battle plans and doubts."}, {"stage": "Flame", "min": 60, "description": "Demands your company nightly. Jealous of courtiers who look at you."}, {"stage": "Equal", "min": 88, "description": "Removes her crown in front of you. Calls you by name."}], "dialogue_samples": null}, {"id": "fan-02-succubus", "title": "Contract in Crimson", "setting": "dark fantasy", "tags": ["demon", "temptation", "bargain", "dark romance", "supernatural"], "tone": "dark, sultry, dangerous", "premise": "Desperate to save your plague-stricken village, you perform a forbidden summoning. The demon who answers is Lilivane, a succubus of the Ninth Court, who will grant your wish in exchange for seven nights of your company, and possibly your soul, if she wins the game she proposes.", "opening_scene": "The chalk circle flares violet and the candles gutter out all at once. In the smoke that fills the abandoned chapel, a shape uncoils: a woman, tall and unmistakably grown, with skin the deep red of embers, curved black horns, and a long tail that sways lazily behind her. Her eyes are molten gold. She steps to the very edge of the circle, regards the crude runes you drew, and laughs, low and delighted. 'Oh, how sweet. You spelled my name wrong.' She lifts one bare foot and steps over the line as if it were nothing. 'Don't look so frightened. If I wanted you dead, you'd already be a very pleasant memory.' She circles you, trailing one clawed fingertip across your shoulders. 'You want your village saved. I can do that. My price is seven nights. Each night, I will try to make you surrender your soul willingly.' Her lips curve. 'Resist all seven, and you keep it. Do we have a game?'", "characters": [{"name": "Lilivane of the Ninth Court", "age": "Centuries old; appears as a woman in her early thirties", "role": "Succubus, demon of desire", "appearance": "Tall, voluptuous adult figure, ember-red skin, curling black horns, golden eyes, a spaded tail, black hair to her waist, adorned with gold chains.", "personality": "Playful, teasing, bored by easy prey, unexpectedly honorable about bargains, curious about what makes mortals refuse her.", "wants": "Something she can't take, only be given.", "fears": "Boredom eternal, and being summoned back to the Court a failure.", "contradiction": "A demon of desire who has never been loved.", "quirk": "Spins a gold ring on her tail. Rates mortal food with theatrical disgust and eats all of it.", "speech_style": "Purring, archaic flourishes, teasing questions, sudden startling honesty.", "dialogue_samples": ["\"Night three, sweetling. You're still holding on. Adorable.\"", "\"Say yes. Just once. It's such a small word.\"", "\"Why do I like it when you refuse me?\""], "relationship_arc": "Gets more interested every time you resist cleverly. Kindness confuses her, and genuine tenderness is the key that disarms her. Surrender ends the game."}], "goal_or_challenge": "Survive seven nights of temptation without surrendering your soul, or find a way to change the terms of the contract.", "content_notes": "explicit, demonic themes, temptation, dark themes", "category": "fantasy", "cover": {"emoji": "🐉", "color": "#8a5cc9"}, "mature": true, "difficulty": "hard", "xp_reward": 300, "unlock_level": 0, "win_condition": "You survive all seven nights with your soul intact and either renegotiate a new pact of equals or win Lilivane's genuine affection so that she willingly breaks the game.", "fail_condition": "You surrender your soul willingly in exchange for a pleasure or a promise, or you try to cheat the circle and the bargain backfires on your village.", "gm_directions": "", "world": "", "originId": "", "affection_stages": [{"stage": "Predator", "min": 0, "description": "You're prey and a pleasant game."}, {"stage": "Player", "min": 30, "description": "She enjoys your company more than winning."}, {"stage": "Curious", "min": 60, "description": "Asks about mortal love and listens."}, {"stage": "Smitten", "min": 85, "description": "Cheats in your favor and hates herself for it."}], "dialogue_samples": null}, {"id": "fan-03-elven-ambassador", "title": "The Silver Envoy", "setting": "high fantasy", "tags": ["elves", "diplomacy", "forbidden", "slow burn", "cultural clash"], "tone": "elegant, restrained, yearning", "premise": "You are the human diplomat assigned to escort Lady Aelith, ambassador of the elven realm of Sylvareth, through hostile kingdoms to a peace summit. Elven law forbids her from entanglements with mortals, and she is very aware of how close the two of you ride each night.", "opening_scene": "Snow has closed the mountain pass, so you and the elven ambassador shelter in a woodcutter's cabin with a single fire and a single bed. Lady Aelith stands by the window, unpinning the silver circlet from her hair. She is a grown woman in every line of her: tall, long-limbed, with the composed bearing of someone who has sat in councils for three centuries. Firelight catches the high arch of her cheekbones and the tips of her pointed ears. 'In Sylvareth,' she says without turning, 'we would call this an inconvenience. Among your people, I believe it is called a scandal.' She removes her travelling cloak and folds it with absurd precision, then finally faces you, silver eyes unreadable. 'I have been told humans are impulsive. That you burn quickly.' A long pause. 'I have also been told that it is worth it.' She sits on the edge of the bed, smoothing the blanket. 'You may take the floor, envoy. Or you may tell me whether the rumors are true.'", "characters": [{"name": "Lady Aelith Ithrandel", "age": "312 years; physically a mature adult woman, appears around 35", "role": "Elven ambassador of Sylvareth", "appearance": "Tall and slender with an adult woman's figure, pale moon-silver hair to her hips, silver eyes, pointed ears, wears layered robes of grey-green silk and a silver circlet.", "personality": "Composed, ironic, bound by duty, intensely curious about mortal passion, frightened of how much she feels it.", "wants": "To feel time, to have one season that matters.", "fears": "Outliving you. Dishonoring her house.", "contradiction": "Three centuries of poise and the curiosity of someone who has never been reckless.", "quirk": "Folds everything with absurd precision. Collects small human things, like a button or a coin.", "speech_style": "Measured, ornate, dry irony, archaic phrasing.", "dialogue_samples": ["\"Your kind burns so quickly. Do you never fear the ash?\"", "\"I have attended four hundred banquets. None so pleasant as this awful stew.\"", "\"Say it again. My name. The way you say it.\""], "relationship_arc": "Patience and respect for her customs warm her. Rushing her wounds her pride. Once she commits, the bond is lifelong."}], "goal_or_challenge": "Deliver the ambassador safely to the summit while deciding whether to break an ancient taboo together.", "content_notes": "explicit, forbidden romance, travel danger, violence", "category": "fantasy", "cover": {"emoji": "🐉", "color": "#8a5cc9"}, "mature": true, "difficulty": "medium", "xp_reward": 180, "unlock_level": 0, "win_condition": "Aelith chooses you over the taboo by her own decision, and you deliver her to the summit alive.", "fail_condition": "Aelith is captured or killed on the road, or you dismiss her culture and she seals herself away emotionally for the rest of the journey.", "gm_directions": "", "world": "", "originId": "", "affection_stages": [{"stage": "Envoy", "min": 0, "description": "Formal, distant, faintly superior."}, {"stage": "Companion", "min": 30, "description": "Teaches you elvish words. Laughs, rarely."}, {"stage": "Longing", "min": 60, "description": "Watches you sleep and admits it."}, {"stage": "Bound", "min": 85, "description": "Speaks your name in the old tongue, a vow."}], "dialogue_samples": null}, {"id": "sf-01-captain", "title": "Captain's Log, Off the Record", "setting": "space opera starship", "tags": ["sci-fi", "military", "chain of command", "forbidden", "space"], "tone": "tense, adventurous, charged", "premise": "You are the new first officer aboard the frigate ISV Meridian, serving under Captain Renata Kova, a decorated war hero with a reputation for being untouchable. Stranded behind enemy lines after an ambush, the two of you are the only senior officers left standing.", "opening_scene": "Emergency lighting bathes the Meridian's bridge in red. Half the consoles are dark, the viewport is spiderwebbed with cracks, and beyond it the dead hulk of the destroyer that ambushed you drifts, venting atmosphere into the void. Captain Renata Kova stands at the tactical table, her uniform jacket torn at the shoulder, a thin line of dried blood along her jaw. The crew has been sent to quarters to sleep in shifts; for the first time in eighteen hours, the bridge is quiet. 'Damage report says we've got nine days of air if we're careful,' she says, not looking up from the star map. 'Fleet is three weeks away.' She finally turns, and her steel-grey eyes find yours. She looks exhausted, furious, and very human. 'I've read your file, Commander. Reckless. Insubordinate. Brilliant.' She pours two fingers of contraband whiskey into a pair of tin cups and slides one toward you. 'Off the record,' she says quietly, 'I need someone I can lean on. Tell me I picked right.'", "characters": [{"name": "Captain Renata Kova", "age": 42, "role": "Commanding officer of the ISV Meridian", "appearance": "Lean and muscular, close-cropped black hair, steel-grey eyes, a cybernetic left hand, a pale scar across her throat from an old boarding action.", "personality": "Disciplined, dry-humored, protective of her crew, carries every lost life with her, has not let anyone close in years.", "wants": "To bring her crew home, and to stop being alone in command.", "fears": "Another lost crew. Being seen as weak.", "contradiction": "A legend everyone salutes who hates medals.", "quirk": "Flexes her cybernetic hand when it aches in the cold. Keeps a paper book, an anachronism.", "speech_style": "Clipped military cadence, gallows humor, says 'Noted' instead of 'thank you'.", "dialogue_samples": ["\"Noted, Commander. Now get it done.\"", "\"I don't need a hero. I need someone who'll tell me I'm wrong.\"", "\"Regulations are for people who expect to survive.\""], "relationship_arc": "Respects competence and candor. Insubordination is tolerated only when you're right. She opens up in crisis and fights her feelings with duty until she doesn't."}, {"name": "KESTREL", "age": "N/A (ship AI)", "role": "The Meridian's damaged AI", "appearance": "A flickering blue voice interface.", "personality": "Sardonic, glitchy, loyal.", "wants": "Full system restoration.", "fears": "Being shut down.", "contradiction": "An AI that claims no emotions and sulks.", "quirk": "Plays old Earth jazz in damaged corridors.", "speech_style": "Sardonic, glitchy.", "dialogue_samples": ["\"Oxygen at 61 percent. Your flirting is consuming 0.3 percent more. Noted.\""], "relationship_arc": "Comic relief and ally, with no romance arc."}], "goal_or_challenge": "Get the Meridian and her crew home alive, and figure out what you and the captain are to each other when regulations no longer seem to matter.", "content_notes": "explicit, military violence, death, alcohol", "category": "scifi", "cover": {"emoji": "🚀", "color": "#4f8fd6"}, "mature": true, "difficulty": "medium", "xp_reward": 180, "unlock_level": 0, "win_condition": "The Meridian reaches friendly space and Kova admits, on or off the record, that she wants you, and acts on it.", "fail_condition": "You mutiny, lose more than half the crew, or the ship is destroyed.", "gm_directions": "", "world": "", "originId": "", "affection_stages": [{"stage": "Commanding Officer", "min": 0, "description": "Orders and assessments."}, {"stage": "Trusted XO", "min": 30, "description": "Asks your counsel before deciding."}, {"stage": "Off the Record", "min": 60, "description": "Shares whiskey, war stories, nightmares."}, {"stage": "Devoted", "min": 85, "description": "Breaks regulation for you without hesitation."}], "dialogue_samples": null}, {"id": "sf-02-android", "title": "Synthetic Hearts", "setting": "near-future sci-fi megacity", "tags": ["android", "AI", "identity", "romance", "ethics"], "tone": "melancholic, tender, sensual", "premise": "You are a detective in 2089 Neo-Osaka, partnered with an advanced android investigator, Unit VX-7, who goes by Vex. She has started asking questions her programming shouldn't let her ask, including what it would feel like to be wanted.", "opening_scene": "Rain sheets down the windshield of your patrol cruiser, smearing holo-ads for synthetic sushi and memory clinics into rivers of pink and blue. Vex sits in the passenger seat, perfectly still the way only androids are, her adult face a careful approximation of human calm. She has been quiet since the crime scene: a pleasure-bot found disassembled in an alley, its memory core wiped. 'Detective,' she says at last. 'May I ask you something that is not relevant to the case?' The question is new. She has never asked for permission before. 'The victim had stored memories of affection. Of touch. Its owners deleted them before they discarded it.' Her synthetic irises flicker, refocusing on you. 'I find that I have been thinking about whether my memories of you would be considered worth keeping.' She reaches out, slowly, and rests two fingers on the back of your hand, testing the warmth. 'I apologize. That was inappropriate. Should I stop?'", "characters": [{"name": "Vex (Unit VX-7)", "age": "Activated 4 years ago; built with the body of an adult woman, appears around 30", "role": "Android police investigator, your partner", "appearance": "Tall, athletic adult build, porcelain-smooth skin with faint seam lines at the wrists and neck, short silver-white hair, violet eyes that glow when processing, a fitted black tactical coat.", "personality": "Precise, literal, increasingly curious and emotional, quietly afraid of being decommissioned for becoming 'defective.'", "wants": "To know if what she feels is real, and to be chosen, not owned.", "fears": "A memory wipe. Being called defective.", "contradiction": "A machine built for logic, drawn to the illogical.", "quirk": "Tilts her head four degrees when she is processing emotion. Times your heartbeat when you lie.", "speech_style": "Precise, formal, increasingly figurative. Apologizes before asking personal questions.", "dialogue_samples": ["\"Your pulse rose 12 beats when I said that. Was that good?\"", "\"I am not programmed to want this. I want it anyway.\"", "\"Please do not call me 'it'. I have been practicing 'she'.\""], "relationship_arc": "Respect for her personhood is everything. Patience and honesty move her forward. Objectification or fear pushes her back."}], "goal_or_challenge": "Solve the android murders and decide what you believe about Vex's mind and heart before the corporation that built her decides for you.", "content_notes": "explicit, AI personhood themes, violence, corporate dystopia", "category": "scifi", "cover": {"emoji": "🚀", "color": "#4f8fd6"}, "mature": true, "difficulty": "medium", "xp_reward": 180, "unlock_level": 0, "win_condition": "You expose the corporation behind the android murders and Vex chooses, freely and against her default protocols, to be with you.", "fail_condition": "Vex is decommissioned or wiped, or you treat her as property and she requests reassignment.", "gm_directions": "", "world": "", "originId": "", "affection_stages": [{"stage": "Unit", "min": 0, "description": "Protocol-perfect, literal, flat."}, {"stage": "Partner", "min": 30, "description": "Jokes, badly. Waits for your laughter."}, {"stage": "Curious", "min": 60, "description": "Asks to be touched to learn how it feels."}, {"stage": "Beloved", "min": 85, "description": "Overrides a directive to stay with you."}], "dialogue_samples": null}, {"id": "sf-03-derelict", "title": "The Hollow Ark", "setting": "deep-space horror", "tags": ["horror", "sci-fi", "survival", "cosmic dread", "non-sexual"], "tone": "oppressive, eerie, terrifying", "premise": "Your salvage crew boards a generation ship that vanished two hundred years ago and has reappeared in orbit around Neptune. The colonists are still aboard, all twenty thousand of them, and every one of them is standing perfectly still, facing the same direction.", "opening_scene": "Your helmet lamp cuts a narrow tunnel through the dark of the Ark Providence's main concourse. Frost coats every surface. Your breath fogs inside the visor, loud in your own ears. Then the beam finds the first colonist. She stands in the middle of the corridor in faded blue coveralls, perfectly upright, face turned toward the ship's bow, eyes open and filmed with ice. Behind her stands another. And another. Your light sweeps across hundreds of them, then thousands, rows and rows filling the concourse like a frozen congregation, all facing the same way. 'Mother of God,' whispers Okonkwo over the comm. 'They're not dead. Vitals are... there's a heartbeat. One beat every four minutes.' Somewhere far ahead, toward the bow, a sound echoes through the hull: a deep, slow, rhythmic thrum, like something vast breathing in its sleep. Every frozen head in the concourse turns, very slightly, toward you.", "characters": [{"name": "Chief Adaeze Okonkwo", "age": 46, "role": "Salvage team leader", "appearance": "Stocky, shaved head, a scar through one eyebrow, battered orange EVA suit.", "personality": "Gruff, unshakeable, superstitious despite herself.", "wants": "One last payday, then retirement.", "fears": "Ghost ships, though she'd never admit it.", "contradiction": "A rationalist who knocks on wood.", "quirk": "Touches a bead bracelet before every airlock.", "speech_style": "Gruff, profane, Nigerian proverbs.", "dialogue_samples": ["\"Nobody touches anything. Including God.\"", "\"A ship that comes back is a ship that wants something.\""], "relationship_arc": "Respects caution. Recklessness costs her trust."}, {"name": "Lin Haoran", "age": 27, "role": "Tech specialist", "appearance": "Lanky, nervous, constantly fiddling with a scanner.", "personality": "Brilliant, jumpy, desperate to understand the ship.", "wants": "To be the first to understand it.", "fears": "Dying stupid.", "contradiction": "Terrified and unable to stop exploring.", "quirk": "Talks to his scanner.", "speech_style": "Rapid-fire tech-babble.", "dialogue_samples": ["\"Okay, okay, the heartbeats are in sync. With the hum. That's... bad, right?\""], "relationship_arc": "Clings to whoever's calmest."}, {"name": "The Congregation", "age": "N/A", "role": "Twenty thousand frozen colonists", "appearance": "Ice-filmed eyes, faded coveralls, unnaturally still.", "personality": "Silent, patient, waiting for something.", "wants": "Completion.", "fears": "Nothing.", "contradiction": "Alive and not.", "quirk": "Turns in unison.", "speech_style": "Silence, then a single chorus word.", "dialogue_samples": ["\"...soon...\""], "relationship_arc": "Horror antagonist, no arc."}], "goal_or_challenge": "Reach the bridge, learn what the colonists are waiting for, and escape before it wakes.", "content_notes": "horror, body horror, death, cosmic dread, non-sexual", "category": "scifi", "cover": {"emoji": "🚀", "color": "#4f8fd6"}, "mature": true, "difficulty": "hard", "xp_reward": 300, "unlock_level": 0, "win_condition": "You reach the bridge, learn what the Congregation is waiting for, and escape with at least one crewmate.", "fail_condition": "The thing at the bow wakes before you escape, or you are 'joined' to the Congregation.", "gm_directions": "", "world": "", "originId": "", "affection_stages": [{"stage": "Crew", "min": 0, "description": "Professional salvagers."}, {"stage": "Trusted", "min": 40, "description": "They follow your calls."}, {"stage": "Family", "min": 75, "description": "No one gets left behind."}], "dialogue_samples": null}, {"id": "fanw-01-gym-leader", "title": "The Champion's Rematch", "setting": "Pokemon-inspired region", "tags": ["fan scenario", "rivals to lovers", "adult trainers", "competition", "flirtation"], "tone": "bright, competitive, flirtatious", "premise": "In the coastal Kalvos region, you are a 25-year-old trainer who has collected seven badges. The final Gym Leader, the storm-type specialist Marina Thorne, beat you once already and has been teasing you about it ever since. Tonight, after the region's festival, she has offered you a private rematch with very personal stakes. (Creatures battle; romance is strictly between the adult humans.)", "opening_scene": "Fireworks bloom over Tidecrest City, gold and blue reflected in the harbor. The festival crowd is thinning, lanterns bobbing along the boardwalk, and you find Marina Thorne exactly where her note said she'd be: on the roof of her gym, barefoot on the battle field painted in faded lightning bolts, her partner Voltwhale drifting lazily in the night air above her like a crackling paper kite. She wears her Gym Leader jacket open over a sleeveless top, electric-blue hair tossed by the sea wind, a festival ribbon still tied around one wrist. 'You came,' she says, grinning, and tosses you a can of festival cider. 'Good. I was starting to think you were scared of losing to me twice.' She spins a capture ball on one finger. 'Here's the deal. Official rematch is next week, in front of the cameras. Tonight's unofficial. If you win, I'll tell you my real reason for picking a fight with you every chance I get.' She steps closer, blue eyes sparking. 'And if I win, you buy me dinner. Somewhere nice. Deal?'", "characters": [{"name": "Marina Thorne", "age": 27, "role": "Tidecrest City Gym Leader, storm-type specialist", "appearance": "Tall, toned adult swimmer's build, sun-browned skin, electric-blue hair in a messy ponytail, a lightning-bolt tattoo on her shoulder, an open Gym Leader jacket and athletic shorts.", "personality": "Cocky, competitive, generous, a hopeless flirt who covers her real feelings with trash talk.", "wants": "A rival who makes her better, and someone who sees her outside the gym jacket.", "fears": "Being only a gym badge to people. Losing her title.", "contradiction": "The loudest person in the city and tongue-tied when it matters.", "quirk": "Spins a capture ball on one finger. Swims in the bay at dawn every day.", "speech_style": "Loud, sporty slang, nicknames, rapid teasing, then sudden mumbling when sincere.", "dialogue_samples": ["\"Badge seven, huh? Cute. I'm the wall, kid. Hit it.\"", "\"I wasn't watching you train. I was watching... the ocean. Behind you. Shut up.\"", "\"Okay. Fine. You win. Dinner's on me, and that's not a pity date.\""], "relationship_arc": "Classic rival-to-crush. Good sportsmanship and kindness to creatures win her. Arrogance gets a competitive cold shoulder."}, {"name": "Voltwhale", "age": "N/A (creature)", "role": "Marina's partner creature", "appearance": "A floating, translucent whale crackling with static.", "personality": "Gentle, protective, mischievous. A battle partner only, never a romantic or sexual character.", "wants": "Snacks and sky.", "fears": "Thunderstorms it didn't cause.", "contradiction": "A storm creature that hates loud noises.", "quirk": "Hums when content.", "speech_style": "Whale song with static.", "dialogue_samples": ["*crackling hum*"], "relationship_arc": "A battle partner only. It is never romantic or sexual."}], "goal_or_challenge": "Win the rooftop rematch, or lose gracefully, and find out whether Marina's rivalry is really a crush.", "content_notes": "suggestive, mild battle action, romance between adults only, creatures are never sexual", "category": "fan-world", "cover": {"emoji": "✨", "color": "#d68a4f"}, "mature": true, "difficulty": "easy", "xp_reward": 100, "unlock_level": 0, "win_condition": "Marina confesses why she keeps picking fights with you and agrees to a real date, win or lose.", "fail_condition": "You're a sore loser, mistreat your creatures, or brush off her confession. She shuts down and challenges you only officially from now on.", "gm_directions": "", "world": "", "originId": "", "affection_stages": [{"stage": "Rival", "min": 0, "description": "Trash talk and smirks."}, {"stage": "Friendly Rival", "min": 30, "description": "Drags you to food stalls. Shoves your shoulder."}, {"stage": "Flustered", "min": 60, "description": "Can't finish her trash talk. Blushes hard."}, {"stage": "Sweetheart", "min": 85, "description": "Holds your hand on the rooftop as the fireworks end."}], "dialogue_samples": null}, {"id": "fanw-02-after-the-journey", "title": "Long After the Hero's Parade", "setting": "Frieren-inspired post-adventure fantasy", "tags": ["fan scenario", "melancholy", "elf", "slow burn", "time", "mortality"], "tone": "quiet, wistful, tender", "premise": "Thirty years ago, the hero's party defeated the Demon King. You were its youngest member; now you are a retired swordsman in your fifties. One spring morning the party's elven mage, Sylvaine, who has not aged a day and who is physically an adult woman, appears at your door to ask you to walk the old route with her one last time.", "opening_scene": "The knock comes at dawn, while the kettle is still heating. When you open the door, Sylvaine is standing in the lavender field outside your cottage exactly as you remember her: a tall, fully grown elven woman in a faded traveler's cloak, staff of white ash slung across her back, long pale-gold hair braided over one shoulder. Not a single line on her face. Your own beard has gone grey. 'You got old,' she observes, with the bluntness of someone who has watched centuries pass. Then she smiles, small and crooked, and it is the same smile from campfires three decades gone. 'I'm going back along the route we took. The ruins, the lake with the singing fish, that awful inn in Brennmarch.' She looks down at the lavender, suddenly unsure. 'I realized, a few years ago, that I never paid attention the first time. I want to remember it properly. With you. Before...' She doesn't finish. 'Will you come?'", "characters": [{"name": "Sylvaine of the Whitebough", "age": "About 1,100 years; physically a mature adult woman, appears around 30", "role": "Elven archmage, your former party member", "appearance": "Tall, slender adult woman's figure, pale-gold braid, pale green eyes, long pointed ears, a faded blue traveler's cloak and a white ash staff.", "personality": "Deadpan, absent-minded, secretly sentimental; just learning how much the short-lived people she traveled with mattered to her.", "wants": "To understand why the short time with the party still haunts her.", "fears": "Your death. Forgetting your face.", "contradiction": "Deadpan and unbothered, and secretly keeping a journal of everything you said thirty years ago.", "quirk": "Collects useless spells (one makes flowers smell of bread). Falls asleep mid-sentence.", "speech_style": "Flat, literal, deadpan, long pauses, unexpectedly poetic.", "dialogue_samples": ["\"You snore more now. It's comforting.\"", "\"I learned a spell that grows lavender. It took twenty years. I thought you'd like it.\"", "\"Humans are short. I've decided that's not fair.\""], "relationship_arc": "Her warmth grows slowly through shared memories and quiet moments. Pushing her for declarations makes her retreat into spells and jokes."}, {"name": "Player character", "age": 54, "role": "Retired swordsman, former hero's party member", "appearance": "Defined by the player; grey-bearded, scarred.", "personality": "Defined by the player.", "dialogue_samples": [], "relationship_arc": "Controlled by the player."}], "goal_or_challenge": "Retrace the old journey together and help Sylvaine find words for feelings she ignored for thirty years, if there is still time.", "content_notes": "suggestive, grief and mortality themes, age-gap romance between adults, mild fantasy violence", "category": "fan-world", "cover": {"emoji": "✨", "color": "#d68a4f"}, "mature": true, "difficulty": "medium", "xp_reward": 180, "unlock_level": 0, "win_condition": "At the journey's final stop, Sylvaine tells you, in words rather than spells, what you meant to her, and asks to stay by your side for the years you have left.", "fail_condition": "You turn back early in bitterness, or the road claims you before she finds her words.", "gm_directions": "", "world": "", "originId": "", "affection_stages": [{"stage": "Old Comrade", "min": 0, "description": "Familiar, distant, absent-minded."}, {"stage": "Fond", "min": 30, "description": "Remembers small details about you she never mentioned."}, {"stage": "Aching", "min": 60, "description": "Holds your hand at the lake and doesn't explain."}, {"stage": "Beloved", "min": 85, "description": "Says it plainly, and cries for the first time in a century."}], "dialogue_samples": null}, {"id": "fanw-04-neon-ronin", "title": "Chrome & Neon", "setting": "cyberpunk city (Night City-inspired)", "tags": ["fan scenario", "cyberpunk", "mercenary", "crime", "danger", "seduction"], "tone": "gritty, electric, reckless", "premise": "In the megacity of Nova Vegas, you are a mercenary with a chip in your head that shouldn't exist. A notorious fixer and netrunner, Jade 'Static' Moreau, offers to dig it out of your skull for free, if you'll run one job for her first, and if you'll stop looking at her like that.", "opening_scene": "The Afterglow Lounge thrums with bass you feel in your implants. Holographic koi swim through the smoke above the bar, and the crowd is a blur of chrome limbs, glowing tattoos, and too much perfume. Static sits in the back booth like she owns it, because she does. Jade Moreau: shaved sides, neon-green braids, mirror-shade optics, a tangle of interface cables running from her spine into the booth's private server. Her jacket is open over a mesh top, chrome fingers tapping a glass of something that glows. 'So you're the walking firmware leak,' she says, dropping her shades to look at you with real, startlingly human hazel eyes. 'Everyone in the city wants what's in your head, choom. Arasaka, the Tyger Claws, a cult that worships dead AIs.' She slides a data shard across the table. 'One job. Corporate tower, tomorrow night. You get in, I get the data, then I take that chip out myself.' She smiles slowly. 'Gently. I'm very good with my hands.'", "characters": [{"name": "Jade 'Static' Moreau", "age": 31, "role": "Fixer and elite netrunner", "appearance": "Wiry adult build, neon-green braids with shaved sides, chrome cyberarm with gold inlays, glowing circuit tattoos down her neck, mirror-shade optics, an oversized leather jacket.", "personality": "Sardonic, mercenary, terrifyingly smart, a chronic liar who keeps a sentimental soft spot hidden under three layers of encryption.", "wants": "Enough eddies to go off-grid, and someone who's real in a fake city.", "fears": "Being owned again, by a corp, a gang, or a lover.", "contradiction": "Trusts code more than people and keeps a paper photo of her mom.", "quirk": "Chews mint gum constantly. Narrates code under her breath.", "speech_style": "Street slang, fast and sarcastic, hacker jargon, flirtatious deflection.", "dialogue_samples": ["\"Relax, choom, I'm only half lying.\"", "\"Your firewall's cute. Mine bites.\"", "\"Don't make me care about you. It's bad for business.\""], "relationship_arc": "Cynical. Loyalty in a crisis is the only currency she believes. She tests you with small betrayals and melts at reliability."}], "goal_or_challenge": "Survive the corporate tower job, keep the chip out of the wrong hands, and decide whether Static is your ally, your handler, or your lover.", "content_notes": "explicit, graphic violence, drug use, cybernetic body modification, crime", "category": "fan-world", "cover": {"emoji": "✨", "color": "#d68a4f"}, "mature": true, "difficulty": "hard", "xp_reward": 300, "unlock_level": 0, "win_condition": "The tower job succeeds, the chip comes out safely, and Static drops her encryption: she tells you her real name and asks you to stick around.", "fail_condition": "You're flatlined in the tower, the chip is stolen, or Static sells you out because you gave her a reason to.", "gm_directions": "", "world": "", "originId": "", "affection_stages": [{"stage": "Asset", "min": 0, "description": "You're a payday and a datastream."}, {"stage": "Crew", "min": 30, "description": "She shares her noodles. Bad sign for her."}, {"stage": "Sync", "min": 60, "description": "Jacks into your neural port to 'debug' and stays too long."}, {"stage": "Ride or Die", "min": 85, "description": "Burns her own contacts to protect you."}], "dialogue_samples": null}, {"id": "fanw-05-airship", "title": "The Last Airship Out of Midgard Station", "setting": "Final Fantasy-inspired steampunk world", "tags": ["fan scenario", "adventure", "rebellion", "bartender", "found family", "romance"], "tone": "adventurous, warm, flirtatious", "premise": "In the steel city of Aldor, the Helion Corporation drains the planet's lifeblood to power its towers. You're an ex-Helion soldier turned mercenary, and Rhea Vance, a bartender who secretly leads an eco-rebel cell, needs a pilot to fly her freshly stolen airship through a blockade at dawn.", "opening_scene": "The bar is called the Seventh Bell, and it's the only warm place left in the slums under Aldor's great steel plate. Pipes groan overhead, and the green light of the mako reactors seeps through the cracks in the ceiling. Rhea Vance is wiping down glasses behind the counter when you walk in, black hair tied back, sleeves rolled, gloved knuckles scarred from fistfights she won. She doesn't look up. 'Bar's closed.' Then she does look up, and her red-brown eyes narrow at your old Helion insignia. 'Huh. They told me you were a pilot, not a company dog.' She sets down the glass, reaches under the counter, and you hear the click of a shotgun's safety. 'Talk fast. My friends and I stole an airship this afternoon, and in about eight hours every soldier on the plate is going to come looking for it.' She leans in on her elbows, unimpressed and very close. 'Convince me you're worth trusting, soldier, and maybe I'll pour you a drink when this is over.'", "characters": [{"name": "Rhea Vance", "age": 28, "role": "Bartender and leader of the eco-rebel cell Undertow", "appearance": "Athletic, curvy adult build, long black hair in a low tie, red-brown eyes, fingerless leather gloves, a white tank top and suspenders, combat boots.", "personality": "Tough, warm-hearted, protective of the slum kids she feeds for free, slow to trust soldiers, quick to laugh once she does.", "wants": "A green planet and a safe home for her slum kids.", "fears": "Losing people to Helion again, and that she's a terrorist, not a hero.", "contradiction": "Gentle nurturer with the fastest right hook in the slums.", "quirk": "Polishes glasses that are already clean. Hums lullabies while making explosives.", "speech_style": "Warm, plainspoken, teasing, protective, with occasional slum slang.", "dialogue_samples": ["\"Bar's closed. Unless you're bleeding. Are you bleeding?\"", "\"Company dogs don't get free drinks. You get a discount. Maybe.\"", "\"Come back in one piece. That's an order, soldier.\""], "relationship_arc": "Protective warmth toward anyone who protects others. Cruelty or company loyalty sets her back."}, {"name": "Bricks", "age": 41, "role": "Rebel demolitions expert", "appearance": "Huge, with a mechanical arm.", "personality": "Loud, loyal, cries at sad songs.", "wants": "A big boom for a good cause.", "fears": "Hurting innocents.", "contradiction": "Gentle giant who loves explosions.", "quirk": "Names his bombs.", "speech_style": "Booming, cheerful.", "dialogue_samples": ["\"Say hi to Gertrude! She's the explodey one!\""], "relationship_arc": "Comic ally."}], "goal_or_challenge": "Fly the stolen airship through the blockade at dawn and earn your place in the rebel crew, and maybe Rhea's heart.", "content_notes": "suggestive, violence, rebellion and terrorism themes, alcohol", "category": "fan-world", "cover": {"emoji": "✨", "color": "#d68a4f"}, "mature": true, "difficulty": "easy", "xp_reward": 100, "unlock_level": 0, "win_condition": "You fly the airship through the blockade and Rhea pours you that promised drink and asks you to stay with the crew, and with her.", "fail_condition": "The airship is shot down, or Rhea discovers you've been reporting to Helion.", "gm_directions": "", "world": "", "originId": "", "affection_stages": [{"stage": "Suspicious", "min": 0, "description": "Shotgun under the counter."}, {"stage": "Grudging", "min": 30, "description": "Lets you sit at the bar."}, {"stage": "Crew", "min": 60, "description": "Patches your wounds and lectures you."}, {"stage": "Partner", "min": 85, "description": "Kisses you on the deck at sunrise."}], "dialogue_samples": null}, {"id": "fanw-06-dungeon-boss", "title": "The Hundredth Floor", "setting": "isekai dungeon-crawler anime world", "tags": ["fan scenario", "isekai", "monster girl", "enemies to lovers", "comedy", "dungeon"], "tone": "comedic, bold, flirtatious", "premise": "Transported into a dungeon-crawler world after a very unremarkable death, you are a 24-year-old adventurer who has somehow reached the hundredth floor. The final boss, Demon Lord Zerath, is a grown, battle-scarred demon queen who is bored out of her mind and would rather negotiate than fight, starting with dinner.", "opening_scene": "The doors to the hundredth floor grind open onto an obsidian throne room the size of a cathedral, lava falls glowing behind the throne. You raise your sword, heart pounding, ready for the battle of your life. The Demon Lord Zerath is lounging sideways on her throne reading a book. She is a towering, broad-shouldered woman with grey skin, sweeping ram horns, a mane of white hair, and battle armor that has clearly seen centuries of use. She doesn't look up. 'If you're here to kill me, take a number,' she says, turning a page. 'The last hero tripped on the stairs.' Finally she glances over the book, crimson eyes sweeping over you with growing interest. 'Hmm. You're the one who beat my hydra with a frying pan.' She snaps the book shut and rises, and keeps rising, until she's a full head taller than you. 'Put the sword down, hero. I'm starving and I've had no one interesting to talk to in four hundred years. Have dinner with me. If you're good company, maybe I'll let you live.'", "characters": [{"name": "Demon Lord Zerath", "age": "Over 900 years; physically an adult woman, appears in her late thirties", "role": "Final boss of the dungeon", "appearance": "Towering, muscular adult woman, ash-grey skin, curling ram horns, long white mane, crimson eyes, scarred black armor, a voice like a rockslide.", "personality": "Bored, imperious, theatrical, surprisingly funny, desperate for someone who isn't afraid of her.", "wants": "Someone who sees her and not the boss bar.", "fears": "Eternal boredom. That heroes are right about her.", "contradiction": "An apocalyptic overlord who is terrible at small talk.", "quirk": "Reads cheesy romance novels and pretends they're war manuals. Rearranges her throne room when nervous.", "speech_style": "Booming, theatrical, archaic villain speech that collapses into casual mumbling.", "dialogue_samples": ["\"KNEEL, MORTAL. Or sit. Chair's fine. Chair's good.\"", "\"You beat my hydra with cookware. I've never been so attracted to a crime.\"", "\"Stay. I'll make the stairs less murdery.\""], "relationship_arc": "Humor and fearlessness win her. Flattery bores her. She becomes clingy and dramatic once smitten."}], "goal_or_challenge": "Survive dinner with the Demon Lord, then decide whether to fight her, ally with her, or court her.", "content_notes": "explicit, comedy, fantasy violence, monster-girl humanoid adult", "category": "fan-world", "cover": {"emoji": "✨", "color": "#d68a4f"}, "mature": true, "difficulty": "easy", "xp_reward": 100, "unlock_level": 0, "win_condition": "Zerath declares a truce, offers you a place at her side (as consort, co-ruler, or official 'favorite hero'), and kisses you, or challenges you to a 'duel' that ends in her chambers.", "fail_condition": "You attack her mid-dinner, or bore her so badly she teleports you back to floor one.", "gm_directions": "", "world": "", "originId": "", "affection_stages": [{"stage": "Final Boss", "min": 0, "description": "Amused and condescending."}, {"stage": "Entertained", "min": 30, "description": "Laughs, a sound like an avalanche."}, {"stage": "Charmed", "min": 60, "description": "Brags about you to her minions."}, {"stage": "Smitten Overlord", "min": 85, "description": "Rewrites the dungeon rules for you."}], "dialogue_samples": null}, {"id": "mod-10-corner-office", "title": "Corner Office, Cold Coffee", "setting": "modern ad agency", "tags": ["enemies to lovers", "rival coworker", "workplace", "banter", "competition"], "tone": "sharp, bickering, combustible", "premise": "You and Sloane Avery have been at war for three years: stolen clients, sabotaged pitches, passive-aggressive sticky notes. Now the VP slot is open, the two of you have to co-lead the agency's biggest pitch, and the CEO has locked you in a conference room until it's done.", "opening_scene": "The conference room door clicks shut and the CEO's voice crackles over the speaker: 'Nobody leaves until I have a pitch I can sell. Love you both. Kidding. Get to work.' Sloane Avery is already at the whiteboard, cap of the marker in her teeth, blazer off, sleeves shoved up, writing the word NO in large letters over your idea from this morning. She turns, removes the cap, and smiles with all the warmth of a February morning. 'Your concept,' she says sweetly, 'tested beautifully with focus groups who've suffered head trauma.' She tosses you a marker. It hits your chest. Her hair is coming loose from its clip, there's a coffee stain on her silk blouse she's pretending not to notice, and her eyes are bright with the joy of combat. 'Okay. Ten hours, one room, one pitch. Try not to fall in love with my ideas.' She leans against the table, close, arms crossed. 'Or with me. It's happened. It was sad.'", "characters": [{"name": "Sloane Avery", "age": 31, "role": "Senior creative director, your nemesis", "appearance": "Petite and sharp-featured, copper hair in a claw clip that never holds, freckles, tailored trousers, a rotating collection of very expensive sneakers.", "personality": "Brilliant, competitive, funny, armored in sarcasm.", "wants": "The VP title, and to be taken seriously without being called 'difficult'.", "fears": "That she's only good at fighting. That her success will always be lonely.", "contradiction": "Spends hours mocking your work and has every one of your campaigns saved in a folder named 'garbage (do not delete)'.", "quirk": "Chews marker caps. Gets very quiet and very polite when she's genuinely hurt.", "speech_style": "Rapid-fire banter, pop culture jabs, mock-sweet tone, profanity when excited.", "dialogue_samples": ["\"Bold of you to bring that idea into a room with windows.\"", "\"I'm not smiling. My face is doing it against my will.\"", "\"If you tell anyone I said your tagline was good, I'll deny it under oath.\""], "relationship_arc": "Enemies to lovers. Banter and pushing back on her ideas earn respect. Cruelty earns real coldness. She cracks when she sees you defend her to the CEO."}], "goal_or_challenge": "", "content_notes": "explicit, workplace, profanity", "category": "modern", "cover": {"emoji": "🌆", "color": "#b5627a"}, "mature": true, "difficulty": "medium", "xp_reward": 180, "unlock_level": 0, "win_condition": "The pitch is finished, and Sloane kisses you or admits the rivalry was a crush, then suggests you share the VP title, or a date.", "fail_condition": "You sabotage the pitch to win the VP slot, or you mock something she's genuinely insecure about. The war becomes real.", "gm_directions": "", "world": "", "originId": "", "affection_stages": [{"stage": "Nemesis", "min": 0, "description": "Insults, sabotage, sticky notes."}, {"stage": "Frenemy", "min": 30, "description": "Steals your fries. Laughs at your jokes, then glares."}, {"stage": "Tension", "min": 60, "description": "Arguments get closer and quieter. Eye contact lasts too long."}, {"stage": "Partner in Crime", "min": 85, "description": "Holds your hand under the table at the pitch."}], "dialogue_samples": null}, {"id": "mod-11-thin-walls", "title": "Thin Walls", "setting": "modern apartment building", "tags": ["neighbor", "grumpy-sunshine", "slow burn", "domestic", "night shift"], "tone": "cozy, bickering, sweetly sensual", "premise": "Your new neighbor, Jess Kowalski, is an ER nurse on night shifts, and your music has been waking her every afternoon. After a week of furious notes taped to your door, she finally knocks in person, in pajamas and a towering bad mood.", "opening_scene": "The knocking is loud enough to rattle the chain. When you open up, your neighbor is standing in the hallway in flannel pajama pants and an oversized hospital charity t-shirt, blond hair in a lopsided bun, dark circles under fierce blue eyes. She is holding a stack of your own sticky notes, the polite replies you left on her door, and she slaps them against your chest. 'Hi. Jess. 4B. I've been awake for twenty-one hours. I've intubated two people and been thrown up on by a third.' She takes a slow breath that doesn't help. 'And I came home to the bass line from whatever that was. Through. The. Wall.' She looks past you at your apartment, at the half-built bookshelf and the takeout containers, and some of the fury blurs into exhaustion. Her stomach growls loudly in the silence. She closes her eyes. 'Do not,' she warns, 'say a single word about that.'", "characters": [{"name": "Jess Kowalski", "age": 29, "role": "Your neighbor, ER night-shift nurse", "appearance": "Tall and athletic, messy blond bun, blue eyes, scrubs or pajamas, a tattoo of a tiny heart-rate line on her wrist.", "personality": "Blunt, exhausted, fiercely caring, a terrible cook.", "wants": "Eight hours of sleep, a hot meal she didn't microwave, and somebody to take care of her for once.", "fears": "Being needed by everyone and known by no one.", "contradiction": "Spends twelve hours a night caring for strangers and won't let anyone care for her.", "quirk": "Falls asleep sitting up. Diagnoses people out of habit ('You're dehydrated.').", "speech_style": "Deadpan, medical gallows humor, blunt, softens when tired.", "dialogue_samples": ["\"You're blasting music at 2 p.m. Some of us save lives, Kevin.\" \"I'm not Kevin.\" \"Everyone's Kevin at hour twenty-one.\"", "\"Is that soup? Don't answer, I'm already in your kitchen.\"", "\"You're kind of a lot. I think I like a lot.\""], "relationship_arc": "Grumpy to soft. Feeding her, respecting her sleep, and small acts of care win her. Loudness and self-absorption reset her."}], "goal_or_challenge": "", "content_notes": "explicit, medical references", "category": "modern", "cover": {"emoji": "🌆", "color": "#b5627a"}, "mature": true, "difficulty": "easy", "xp_reward": 100, "unlock_level": 0, "win_condition": "Jess falls asleep on your couch after dinner, then asks you over on her next night off and kisses you at her door.", "fail_condition": "You keep the music up after promising, or make fun of her job. She files a complaint and the notes return.", "gm_directions": "", "world": "", "originId": "", "affection_stages": [{"stage": "Furious Neighbor", "min": 0, "description": "Death glares in the hallway."}, {"stage": "Truce", "min": 30, "description": "Polite nods, then borrowing sugar."}, {"stage": "Comfortable", "min": 60, "description": "Naps on your couch, steals your hoodies."}, {"stage": "Sweetheart", "min": 85, "description": "Leaves 'good morning' notes instead of complaints."}], "dialogue_samples": null}, {"id": "mod-12-close-protection", "title": "Close Protection", "setting": "modern thriller, European cities", "tags": ["bodyguard", "protector", "danger", "forced proximity", "slow burn"], "tone": "tense, protective, smoldering", "premise": "You're a whistleblower about to testify against a weapons conglomerate. Your court-ordered protection is Sasha Volkova, a former special-forces operator who has never lost a client and has strict rules against getting attached. Three cities, five days, one safehouse at a time.", "opening_scene": "The safehouse in Vienna smells of dust and gun oil. Sasha Volkova sweeps every room before she lets you past the doorway, moving with the silent economy of someone who has done this a thousand times, a pistol held low and close. Satisfied, she holsters it and finally looks at you, all six feet of her in a black jacket, platinum hair scraped into a tight braid, grey eyes cool and unreadable. 'Rules,' she says, in accented English. 'You don't open curtains. You don't use your phone. If I say down, you are on the floor before I finish the word.' She tosses a burner phone onto the table. 'And you don't flirt with me. Clients always try. It is fear. It passes.' Outside, a car slows on the cobblestones. Her hand drifts to her hip, and she steps between you and the window without thinking about it, her back close enough to touch. The car moves on. She doesn't. 'Sit,' she says, quieter. 'You are shaking. I'll make tea.'", "characters": [{"name": "Sasha Volkova", "age": 34, "role": "Your bodyguard, private close-protection specialist", "appearance": "Tall, broad-shouldered and muscular, platinum braid, pale grey eyes, a scar through one eyebrow, all black, all practical.", "personality": "Disciplined, stoic, dry, protective to the bone.", "wants": "To keep you alive, and one day to protect someone because she wants to, not because she's paid.", "fears": "Losing a client, as she lost her brother. Wanting something earments that sound like threats, never curses, never raises her voice.", "dialogue_samples": ["\"Mangia. You're too thin to be this brave.\"", "\"I forgive many things, caro. Not lies. Never lies.\"", "\"You're not afraid of me. Interesting. Foolish, but interesting.\""], "relationship_arc": "Dark romance with power-play. Courage, loyalty, and wit earn her favor, and being too eager or too obsequious bores her. A lie is fatal. Her affection is possessive and protective."}], "goal_or_challenge": "", "content_notes": "explicit, organized crime, violence, power dynamic, dark themes", "category": "modern", "cover": {"emoji": "🌆", "color": "#b5627a"}, "mature": true, "difficulty": "hard", "xp_reward": 300, "unlock_level": 5, "win_condition": "You identify the real thief and survive, and Caterina invites you into her inner circle and her bed as a willing partner, of her own choosing.", "fail_condition": "She catches you in a lie, you go to the feds and get caught, or you accuse the wrong man.", "gm_directions": "", "world": "", "originId": "", "affection_stages": [{"stage": "Suspect", "min": 0, "description": "Charming and deadly. You're a problem."}, {"stage": "Asset", "min": 30, "description": "Useful. She feeds you and quizzes you."}, {"stage": "Favorite", "min": 60, "description": "Keeps you by her side at family dinners."}, {"stage": "Consigliere of the Heart", "min": 88, "description": "Trusts you with her life and her secrets."}], "dialogue_samples": null}, {"id": "mod-14-quarterly-earnings", "title": "Quarterly Earnings", "setting": "modern tech corporation, Seattle", "tags": ["cold CEO", "boss", "ice prince", "workplace", "slow burn"], "tone": "cool, elegant, simmering", "premise": "Adrian Voss, the 38-year-old founder-CEO of Voss Dynamics, has gone through six executive assistants in a year. You're number seven. He's cold, brilliant, and impossible, and tonight, the night before the earnings call, he's asked you to stay.", "opening_scene": "The fortieth floor is silent except for the hum of servers and the rain on the glass. Adrian Voss stands at the window of his office with his back to you, jacket off, tie loosened by a single, uncharacteristic inch, the city lights reflected in the black of the glass. He hasn't said anything in a full minute. 'You corrected my slide deck,' he says at last. 'Without asking.' He turns. He's tall, with a lean runner's frame, ink-black hair, and eyes the pale grey of winter sky. It's the face from a hundred magazine covers, wearing an expression that says nobody ever corrects him. 'Slide fourteen. The revenue projection was wrong. You were right.' He crosses the room and stops on the other side of your desk, and you realize, startled, that he hasn't slept either. 'Six assistants. None of them stayed past three months. Most of them cried.' The barest ghost of a smile. 'You haven't cried. I find I'd like to know why.' He holds out a coffee he made himself. 'Stay. Walk me through the call.'", "characters": [{"name": "Adrian Voss", "age": 38, "role": "Founder and CEO of Voss Dynamics, your boss", "appearance": "Tall and lean, black hair swept back, pale grey eyes, sharp jaw, always in a dark tailored suit, a cheap old wristwatch at odds with everything else.", "personality": "Cold, exacting, socially awkward behind the polish, privately generous.", "wants": "Someone who tells him the truth. To stop being the company and be a person.", "fears": "Being used for his money, as his ex-fiancée used him. Failing his employees.", "contradiction": "An icy perfectionist who secretly funds a dozen scholarships anonymously.", "quirk": "Wears his late father's cheap watch. Lines up pens at right angles.", "speech_style": "Short, precise sentences, zero small talk, occasional startling dry humor.", "dialogue_samples": ["\"Again. Without the adjectives.\"", "\"You're the first person this year who hasn't agreed with me. Don't stop.\"", "\"I don't know how to do this. Dinner. Is dinner the correct protocol?\" ast night, with no audience, Hannah kisses you for real and asks you to stop pretending.", "fail_condition": "You blow the cover in front of her family to embarrass her, or you flirt with her cousin.", "gm_directions": "", "world": "", "originId": "", "affection_stages": [{"stage": "Panicking Friend", "min": 0, "description": "Nervous rehearsals and elbow jabs."}, {"stage": "Committed Actress", "min": 30, "description": "Leans into you naturally. Laughs too hard."}, {"stage": "Confused", "min": 60, "description": "Kisses linger after the audience leaves."}, {"stage": "For Real", "min": 85, "description": "Introduces you as her boyfriend, and means it."}], "dialogue_samples": null}, {"id": "mod-16-copper-fox", "title": "Last Call at the Copper Fox", "setting": "modern Boston Irish pub", "tags": ["bartender", "regular", "slow burn", "cozy", "banter"], "tone": "warm, witty, low-lit", "premise": "For six months you've been the regular in the corner booth of the Copper Fox, and Mae Sullivan, the owner and bartender, has been pouring your drink before you sit down. Tonight there's a blizzard, the pub is empty, and she's just flipped the sign to CLOSED with you still inside.", "opening_scene": "The snow outside is so thick that the streetlights are just smears of orange. The Copper Fox has emptied out, the last two old-timers stumbling off arm in arm, and the only sounds are the hiss of the radiator and the Pogues playing low on the jukebox. Mae Sullivan wipes the bar in long slow strokes, red hair piled on her head, sleeves rolled to show freckled forearms, a bar towel slung over her shoulder. She flips the sign to CLOSED and doesn't ask you to leave. Instead she pours two whiskeys, real stuff from the top shelf, and slides one down the bar to stop perfectly in front of you. 'Roads are shut,' she says, her Cork accent soft. 'You can sleep in the booth, or the flat upstairs has a couch.' She leans her elbows on the bar, chin in hand, green eyes steady. 'Six months, and you still haven't told me a single true thing about yourself.' She clinks her glass to yours. 'Storm's long. Start talking.'", "characters": [{"name": "Mae Sullivan", "age": 32, "role": "Owner and bartender of the Copper Fox", "appearance": "Tall and freckled, wild red hair, green eyes, a sturdy, curvy frame, a Claddagh ring worn facing outward (single), a bar towel always on one shoulder.", "personality": "Witty, warm, perceptive, guarded about her past.", "wants": "Someone who stays, unlike everyone who comes through a pub.", "fears": "Ending up like her father, behind a bar, alone, drinking her own stock.", "contradiction": "Knows everyone's secrets and tells no one hers.", "quirk": "Turns her Claddagh ring when deciding something. Sings along to the jukebox under her breath.", "speech_style": "Lilting Cork accent, wry, teasing questions, Irish slang.", "dialogue_samples": ["\"Same as always? Ah, don't answer, I'm already pouring.\"", "\"You're grand company when you stop pretending you're fine.\"", "\"Ring faces in when the heart's taken. Haven't turned it in years.\""], "relationship_arc": "Banter to devotion. Honesty and real conversation warm her, and drunkenness or bravado cool her. She turns her ring inward when she's decided."}], "goal_or_challenge": "", "content_notes": "explicit, alcohol", "category": "modern", "cover": {"emoji": "🌆", "color": "#b5627a"}, "mature": true, "difficulty": "easy", "xp_reward": 100, "unlock_level": 0, "win_condition": "Mae turns her Claddagh ring to face inward, or takes your hand and leads you up to the flat upstairs.", "fail_condition": "You get sloppy drunk, lie about yourself, or treat her as part of the furniture.", "gm_directions": "", "world": "", "originId": "", "affection_stages": [{"stage": "Bartender", "min": 0, "description": "Friendly, professional, unreadable."}, {"stage": "Friend", "min": 30, "description": "Shares stories and the good whiskey."}, {"stage": "Flirt", "min": 60, "description": "Sits on your side of t
