  const cs = combatSummary(); if (cs && kind !== 'char') sec.push(cs);
  if (kind !== 'char' && kind !== 'scribe') sec.push(`CHARACTERS (the player controls ${pcName}):\n` + chars().map(ch => charLine(ch, kind === 'rules' || kind === 'economy')).join('\n'));

  if (kind === 'plan' || kind === 'gm' || kind === 'economy') {
    key = 'gm'; bot = gmBot();
    sys = D.agents.gm.prompt;
    if (bot) sys += `\n\n${bot.systemPrompt}${bot.exampleDialogue ? '\n\nExample of the desired prose and tone (style reference only — do not copy):\n' + bot.exampleDialogue : ''}`;
  }
  if (kind === 'gm' || kind === 'economy') {
    sys += '\n' + PROGRESS_DOC;
    const sm = chat.scenarioMeta;
    if (sm && (sm.win_condition || sm.fail_condition || sm.goal_or_challenge)) sys += `\nSCENARIO "${sm.title}": goal — ${sm.goal_or_challenge || '(see premise)'}${sm.win_condition ? '; WIN when: ' + sm.win_condition : ''}${sm.fail_condition ? '; FAIL when: ' + sm.fail_condition : ''}${sm.difficulty ? '; difficulty: ' + sm.difficulty : ''}.`;
    if (sm && sm.tone) sys += `\nScenario tone: ${sm.tone}.`;
    if (sm && sm.gm_directions) sys += `\nScenario GM directions (the user's table rules; the ABSOLUTE RULE below still overrides them):\n${String(sm.gm_directions).slice(0, 1500)}`;
    if (sm && Array.isArray(sm.dialogue_samples) && sm.dialogue_samples.length) sys += '\nVoice samples for this scenario (style only):\n' + sm.dialogue_samples.slice(0, 6).map(x => typeof x === 'string' ? x : `${x.character || x.name || ''}: ${x.line || x.text || ''}`).join('\n');
  }
  let task = o.task || '', remind = '';
  if (kind === 'plan') {
    sys += '\n' + PLAN_ADDENDUM;
    const names = aiChars().filter(c => c.present !== false).map(c => c.name);
    sys += `\nCharacters the Characters Lead can voice: ${names.length ? names.join(', ') : '(none)'}.`;
    maxTokens = 350; label = 'GM is planning';
    task = task || 'Plan this turn.';
    remind = 'Output only the JSON object.';
  } else if (kind === 'gm') {
    sys += `\n\nIn this turn the specialist agents have already acted (see transcript). Do not roll dice yourself; use their results. If the player must roll before you can continue, use: {"tool":"request_roll","expr":"1d20+X","who":"${pcName}","label":"Skill DC N"} and stop.`;
    label = 'Game Master is narrating';
    remind = `Narrate now as the GM (${len.words}). Show, don't tell. Never act, speak or decide for ${pcName}. Do not write dialogue for the AI-voiced characters (${aiChars().map(c => c.name).join(', ') || 'none'}) — they speak for themselves right after you. End on a hook.`;
  } else if (kind === 'economy') {
    const names = aiChars().filter(c => c.present !== false);
    sys += `\n\nECONOMY SCRIPT MODE — you voice the whole table in one reply, as a script with labelled blocks, each starting on a new line:
[GM] narration (show, don't tell)
[Rules] one terse mechanical line — only when mechanics apply
[Character Name] that character's own words in "quotes" and actions in *asterisks* — only for: ${names.map(c => c.name).join(', ') || '(no AI characters)'}
Give each character their distinct voice (see CHARACTERS). Only characters who would naturally react speak; usually zero to two. Never write lines, actions or thoughts for ${pcName}.
${TOOLS_DOC}`;
    const botLines = names.map(c => { const b = c.botId && D.bots.find(x => x.id === c.botId); return b && b.exampleDialogue ? `${c.name} sounds like: ${b.exampleDialogue.slice(0, 220)}` : ''; }).filter(Boolean);
    if (botLines.length) sys += '\nVoice references:\n' + botLines.join('\n');
    label = 'Game Master (economy) is writing'; maxTokens = Math.min(+S.maxTokens || 900, len.tokens * 2 + 250);
    remind = `Write the script now (${len.words} of narration, plus short character lines). End on a hook for ${pcName}.`;
  } else if (kind === 'rules') {
    sys = D.agents.rules.prompt + '\n' + TOOLS_DOC; label = 'Rules agent is adjudicating'; maxTokens = 300;
    remind = `Be terse. The player character is ${pcName}.`;
  } else if (kind === 'lore') {
    sys = D.agents.lore.prompt; label = 'Lore keeper is checking continuity'; maxTokens = 260;
  } else if (kind === 'lead') {
    sys = D.agents.characters.prompt + `\nRespond with ONLY JSON: {"speakers":[{"name":"<exact name>","direction":"<intent/emotion/subtext>"}]} — an empty list if nobody should speak.`;
    const names = aiChars().filter(c => c.present !== false).map(c => c.name);
    sys += `\nCharacters you may choose from: ${names.join(', ') || '(none)'}.`;
    label = 'Characters Lead is casting'; maxTokens = 220;
  } else if (kind === 'char') {
    const ch = charById(o.charId); if (!ch) throw new Error('Character not found');
    key = 'char:' + ch.id; bot = ch.botId ? D.bots.find(b => b.id === ch.botId) : null;
    const cfg = agentCfg(key);
    const P = ch.personality || {};
    const pb = Core.profBonus(ch.level);
    const sheet = [`${ch.name}, ${[ch.race, ch.cls].filter(Boolean).join(' ')} (level ${ch.level}). HP ${ch.hp.cur}/${ch.hp.max}, AC ${ch.ac}.`,
      ch.age && `Age: ${ch.age}.`, ch.appearance && `Appearance: ${ch.appearance}`,
      Core.ABILITIES.map(a => `${a.toUpperCase()} ${ch.abilities[a]}`).join(', ') + `; proficiency +${pb}.`,
      ch.inventory && 'Carrying: ' + ch.inventory, ch.spells && 'Spells: ' + ch.spells.replace(/\n/g, '; '), ch.notes && 'Notes: ' + ch.notes].filter(Boolean).join('\n');
    const pers = [P.traits && 'Traits: ' + P.traits, P.ideals && 'Ideals: ' + P.ideals, P.bonds && 'Bonds: ' + P.bonds, P.flaws && 'Flaws: ' + P.flaws, P.voice && 'Voice & speech: ' + P.voice, P.backstory && 'Backstory: ' + P.backstory].filter(Boolean).join('\n') || '(improvise consistently)';
    const botTxt = bot ? `\nCORE CHARACTER CONCEPT\n${bot.systemPrompt}${bot.exampleDialogue ? '\n\nExample of how you talk (style only, do not copy):\n' + bot.exampleDialogue.replace(/\{\{char\}\}/gi, ch.name).replace(/\{\{user\}\}/gi, pcName) : ''}\n` : '';
    const tpl = (cfg.prompt && cfg.prompt.trim()) || D.agents.charTemplate || DEFAULT_PROMPTS.char;
    sys = tpl.replace(/\{\{name\}\}/g, ch.name).replace(/\{\{race\}\}/g, ch.race || '').replace(/\{\{class\}\}/g, ch.cls || 'adventurer')
      .replace(/\{\{player\}\}/g, pcName).replace(/\{\{sheet\}\}/g, sheet).replace(/\{\{personality\}\}/g, pers).replace(/\{\{bot\}\}/g, botTxt);
    const others = chars().filter(c => c.id !== ch.id && c.present !== false).map(c => c.name);
    sec.push(`PRESENT IN THE SCENE: ${others.join(', ') || 'nobody else'}. You are ${ch.name}.`);
    label = `${ch.name} is responding`;
    maxTokens = Math.min(+S.maxTokens || 700, Math.round(len.tokens * 0.7) + 100);
    remind = `Reply only as ${ch.name}: dialogue in "quotes", actions in *asterisks*, ${chat.length === 'long' ? '2–6' : '1–4'} sentences. Stay in character and in your own voice. Do not narrate outcomes or speak for ${pcName}.${bot && bot.postHistory ? ' ' + bot.postHistory : ''}`;
  } else if (kind === 'scribe') {
    sys = D.agents.scribe.prompt + `\nRespond with ONLY JSON:
{"summary":"updated rolling summary of the WHOLE story so far, max 220 words, merging the previous summary with the new events",
 "session_notes":["bullet of what happened", "..."],
 "npcs":[{"name":"","description":""}], "locations":[{"name":"","description":""}],
 "quests":[{"title":"","status":"active|completed|failed","description":""}]}
Only list NPCs, locations and quests that are new or changed.`;
    label = 'Scribe is writing the chronicle'; maxTokens = 900;
  }
  sys += '\n\n' + contentPolicy();

  // transcript within budget
  const fixed = Core.estimateTokens(sys + sec.join('\n\n')) + maxTokens + 300;
  const budget = Math.max(600, (+S.contextTokens || 8000) - fixed);
  let lines;
  if (kind === 'scribe') {
    const from = chat.memory.cursor || 0;
    lines = chat.messages.slice(from, upto).map(lineFor).filter(Boolean);
    let t = lines.reduce((a, l) => a + Core.estimateTokens(l), 0);
    while (lines.length > 4 && t > budget) { t -= Core.estimateTokens(lines[0]); lines.shift(); }
    sec.push('PREVIOUS SUMMARY:\n' + (chat.memory.summary || '(none yet)'));
    sec.push('NEW TRANSCRIPT TO RECORD:\n' + (lines.join('\n') || '(empty)'));
  } else {
    lines = recentLines(upto, budget);
    sec.push('RECENT TRANSCRIPT:\n' + (lines.join('\n') || '(the session is just beginning)'));
  }
  if (chat.authorNote && kind !== 'scribe' && kind !== 'lore') sec.push(`[Author's note — scene direction from the player, follow it: ${chat.authorNote}]`);
  if (task) sec.push('YOUR TASK: ' + task);
  if (S.reinforce && remind) sec.push('REMINDER: ' + remind);
  const ar = ['gm', 'economy'].includes(kind) ? antiRepeatBlock(m => m.agent === 'gm') : kind === 'char' ? antiRepeatBlock(m => m.charId === o.charId) : '';
  if (ar) sec.push(ar);
  return { system: sys, user: sec.join('\n\n'), key, bot, maxTokens, label, kind };
}

function updateMeter(tokens) {
  const el = $('#ctxMeter'); if (!el) return;
  const max = +S.contextTokens || 8000, pct = Math.min(100, Math.round(tokens / max * 100));
  el.className = 'meter' + (pct > 90 ? ' high' : pct > 70 ? ' mid' : '');
  el.querySelector('i').style.width = pct + '%';
  el.querySelector('.lbl').textContent = `${(tokens / 1000).toFixed(1)}k / ${(max / 1000).toFixed(0)}k tok`;
}
function setActiveAgent(key) {
  activeAgent = key;
  $$('.node').forEach(n => n.classList.toggle('active', n.dataset.agent === key));
}

// Run one agent call, optionally displayed as a (streaming) chat message.
async function runAgent(p, o = {}) {
  const { c, model, temperature } = resolveModel(p.key, p.bot);
  const messages = [{ role: 'system', content: p.system }, { role: 'user', content: p.user }];
  lastContextTokens = Core.estimateTokens(p.system + p.user); updateMeter(lastContextTokens);
  let m = o.appendTo || null, base = '', newSwipe = !!o.newSwipe;
  if (o.display !== false) {
    if (m) {
      if (newSwipe) { m.swipes.push(''); m.swipeIdx = m.swipes.length - 1; } else base = msgText(m);
    } else {
      const ch = p.kind === 'char' ? charById(o.charId) : null;
      m = { id: uid(), role: 'agent', agent: p.kind === 'char' ? 'char' : p.kind === 'economy' || p.kind === 'plan' ? 'gm' : p.kind,
        charId: ch ? ch.id : undefined, name: ch ? ch.name : AGENT_META[p.kind === 'economy' ? 'gm' : p.kind].name,
        ts: Date.now(), swipes: [''], swipeIdx: 0, aside: !!o.aside, script: p.kind === 'economy',
        gen: { kind: p.kind, task: o.task || '', charId: o.charId } };
      chat.messages.push(m);
      appendMsgEl(m);
    }
    m.streaming = true; rerenderMsg(m);
  }
  setActiveAgent(p.key);
  let text = '';
  try {
    text = await chatRequest({ c, model, messages, temperature, maxTokens: p.maxTokens, stream: o.stream != null ? o.stream : S.stream, signal: abortCtl && abortCtl.signal, label: p.label,
      onDelta: (full) => { if (m) { m.swipes[m.swipeIdx] = base + (base && !/\s$/.test(base) ? ' ' : '') + full; rerenderMsg(m, true); } } });
  } catch (e) {
    if (m) {
      m.streaming = false;
      if (!msgText(m).trim()) { if (newSwipe) { m.swipes.splice(m.swipeIdx, 1); m.swipeIdx = Math.max(0, m.swipeIdx - 1); } else if (!o.appendTo) { chat.messages = chat.messages.filter(x => x !== m); removeMsgEl(m); } }
      else m.swipes[m.swipeIdx] += e.name === 'AbortError' ? ' …' : '';
      if (m && chat.messages.includes(m)) rerenderMsg(m);
      markDirty('chat');
    }
    throw e;
  } finally { setActiveAgent(null); }
  text = Core.stripThink(text);
  if (m) {
    m.swipes[m.swipeIdx] = base + (base && text && !/\s$/.test(base) ? ' ' : '') + text.trim();
    m.streaming = false; m.model = model; m.ts = Date.now();
    rerenderMsg(m); markDirty('chat'); touchChat();
  }
  if (!newSwipe && o.display !== false) { const pt = Core.parseProgressTags(text); if (pt.tags.length) progressEvents(Progress.applyTags(pt.tags)); }
  return { text, msg: m };
}

/* ---------- Tool execution ---------- */
function findCombatTarget(name) {
  const cb = camp().combat;
  const n = Core.matchName(name, cb.combatants.map(x => x.name));
  return n ? cb.combatants.find(x => x.name === n) : null;
}
function applyHp(target, amount, set) {
  const cmb = findCombatTarget(target);
  if (cmb) {
    const before = cmb.hp;
    cmb.hp = set != null ? set : Math.max(0, Math.min(cmb.maxHp, cmb.hp + amount));
    const ch = cmb.charId && charById(cmb.charId); if (ch) ch.hp.cur = cmb.hp;
    if (cmb.hp === 0 && !cmb.conditions.includes('Unconscious') && cmb.charId) cmb.conditions.push('Unconscious');
    return `${cmb.name}: HP ${before} → ${cmb.hp}${cmb.hp === 0 ? (cmb.charId ? ' (down!)' : ' (defeated)') : ''}`;
  }
  const ch = charByName(target);
  if (ch) {
    const before = ch.hp.cur;
    ch.hp.cur = set != null ? set : Math.max(0, Math.min(ch.hp.max, ch.hp.cur + amount));
    return `${ch.name}: HP ${before} → ${ch.hp.cur}`;
  }
  return `Could not find "${target}" to change HP`;
}
function applyCondition(target, add, remove) {
  const cmb = findCombatTarget(target), ch = cmb ? (cmb.charId && charById(cmb.charId)) : charByName(target);
  const list = cmb ? cmb.conditions : ch ? (ch.conditions = ch.conditions || []) : null;
  if (!list) return `Could not find "${target}"`;
  const norm = (x) => { const n = Core.matchName(x, Core.CONDITIONS); return n || String(x).replace(/^\w/, c => c.toUpperCase()); };
  if (add) { const a = norm(add); if (!list.includes(a)) list.push(a); }
  if (remove) { const r = norm(remove); const i = list.indexOf(r); if (i >= 0) list.splice(i, 1); }
  return `${cmb ? cmb.name : ch.name}: ${add ? '+' + norm(add) : ''}${remove ? ' −' + norm(remove) : ''}`;
}
function addCombatant({ name, hp, ac, init, count, charId }) {
  const cb = camp().combat; const added = [];
  for (let i = 0; i < (count || 1); i++) {
    let h = Number(hp);
    if (isNaN(h)) { const r = Core.tryRoll(hp); h = r.error ? 10 : Math.max(1, r.total); }
    const nm = count > 1 ? `${name} ${i + 1}` : (cb.combatants.some(x => x.name === name) ? `${name} ${cb.combatants.filter(x => x.name.startsWith(name)).length + 1}` : name);
    const c = { id: uid(), name: nm, hp: h, maxHp: h, ac: Number(ac) || 10, initMod: Number(init) || 0, init: null, conditions: [], charId: charId || null };
    cb.combatants.push(c); added.push(c);
  }
  return added;
}
function rollInitiative(all = false) {
  const cb = camp().combat; const out = [];
  cb.combatants.forEach(c => {
    if (all || c.init == null) {
      const r = Core.roll('1d20' + (c.initMod ? (c.initMod > 0 ? '+' : '') + c.initMod : ''));
      c.init = r.total; c.initRoll = r.natural; out.push(`${c.name} ${r.total}`);
    }
  });
  sortInit();
  if (!cb.round) { cb.round = 1; cb.turn = 0; }
  return out;
}
function sortInit() {
  const cb = camp().combat;
  const cur = cb.combatants[cb.turn];
  cb.combatants.sort((a, b) => (b.init ?? -99) - (a.init ?? -99) || (b.initMod || 0) - (a.initMod || 0));
  cb.turn = Math.max(0, cb.combatants.indexOf(cur));
}
function doRoll(expr, who, label, opts = {}) {
  const r = Core.tryRoll(expr);
  if (r.error) { if (chat && opts.toChat !== false) pushSystem(`Dice error in "${expr}": ${r.error}`, true); else toast('Dice error: ' + r.error); return null; }
  const rec = { id: uid(), ts: Date.now(), who: who || '', label: label || '', expr: r.input, total: r.total, breakdown: r.breakdown, crit: r.crit, fumble: r.fumble };
  D.rolls.unshift(rec); D.rolls.length = Math.min(D.rolls.length, 300);
  markDirty('data');
  if (chat && opts.toChat !== false) {
    const m = Object.assign({ role: 'roll' }, rec, { id: uid() });
    chat.messages.push(m); appendMsgEl(m); markDirty('chat');
  }
  if (typeof renderDiceHistory === 'function') renderDiceHistory();
  { const pc = chat && typeof playerChar === 'function' ? playerChar() : null;
    if (!rec.who || (pc && Core.matchName(rec.who, [pc.name]))) progressEvents(Progress.onRoll(rec)); }
  return rec;
}
function pushSystem(text, error = false, forAI = false) {
  const m = { id: uid(), role: 'system', text, ts: Date.now(), error, forAI };
  chat.messages.push(m); appendMsgEl(m); markDirty('chat');
  return m;
}
function execTools(calls, source) {
  const res = { rolled: 0, requested: false, changed: false };
  calls.forEach(c => {
    if (c.tool === 'roll') { if (doRoll(c.expr, c.who || source, c.label)) res.rolled++; }
    else if (c.tool === 'request_roll') {
      const m = { id: uid(), role: 'request', expr: c.expr, who: c.who || (playerChar() ? playerChar().name : 'Player'), label: c.label, dc: c.dc, ts: Date.now(), done: false, by: source };
      chat.messages.push(m); appendMsgEl(m); res.requested = true;
    } else if (c.tool === 'hp') { pushSystem(applyHp(c.target, c.amount, c.set) + (c.label ? ` (${c.label})` : ''), false, true); res.changed = true; }
    else if (c.tool === 'condition') { pushSystem(applyCondition(c.target, c.add, c.remove), false, true); res.changed = true; }
    else if (c.tool === 'add_combatant') { const a = addCombatant(c); pushSystem(`Combat: added ${a.map(x => `${x.name} (HP ${x.hp}, AC ${x.ac})`).join(', ')}`, false, true); res.changed = true; }
    else if (c.tool === 'roll_initiative') {
      aiChars().concat(playerChar() ? [playerChar()] : []).filter(ch => ch.kind === 'PC' && ch.present !== false && !camp().combat.combatants.some(x => x.charId === ch.id))
        .forEach(ch => addCombatant({ name: ch.name, hp: ch.hp.cur, ac: ch.ac, init: Core.abilityMod(ch.abilities.dex) + (+ch.initBonus || 0), count: 1, charId: ch.id }));
      const out = rollInitiative(); pushSystem('Initiative: ' + (out.join(', ') || 'already rolled') + ` — round ${camp().combat.round}`, false, true); res.changed = true;
    } else if (c.tool === 'end_combat') { camp().combat = { round: 0, turn: 0, combatants: [] }; pushSystem('Combat ended.', false, true); res.changed = true; }
  });
  if (res.changed) { markDirty('data'); refreshSidePanels(); }
  markDirty('chat');
  return res;
}

/* ---------- Turn orchestration ---------- */
function beginBusy() { busy = true; abortCtl = new AbortController(); updateBusyUI(); }
function endBusy() { busy = false; abortCtl = null; setStatus(''); updateBusyUI(); refreshSidePanels(); markDirty('chat'); }
function updateBusyUI() {
  $('#stopBtn').classList.toggle('hidden', !busy);
  $('#sendBtn').classList.toggle('hidden', busy);
}
function stopGeneration() { if (abortCtl) abortCtl.abort(); }
function friendly(e) { return e && e.message ? e.message : String(e); }
function lastInputText() {
  for (let i = chat.messages.length - 1; i >= 0; i--) { const m = chat.messages[i]; if (m.role === 'user' || m.role === 'roll') return lineFor(m) || ''; }
  return '';
}

async function runTurn(opts = {}) {
  if (busy) return;
  if (!isConfigured()) { showNoModel(true); return; }
  beginBusy();
  try {
    if (opts.kind === 'npc') await runCharacter(opts.charId, opts.direction || 'React to the current moment.');
    else if (S.economy) await runEconomy(opts);
    else await runFull(opts);
    if (opts.kind !== 'npc' && opts.kind !== 'continue') {
      chat.turnsSinceScribe = (chat.turnsSinceScribe || 0) + 1;
      if (+S.scribeEvery > 0 && chat.turnsSinceScribe >= +S.scribeEvery && D.agents.scribe.enabled && !pendingRoll) await runScribe(true);
    }
  } catch (e) {
    if (e.name === 'AbortError') pushSystem('Generation stopped.');
    else { console.error(e); pushSystem('⚠ ' + friendly(e), true); }
  } finally { endBusy(); }
}

async function runFull(opts) {
  pendingRoll = false;
  const en = { rules: D.agents.rules.enabled, lore: D.agents.lore.enabled, characters: D.agents.characters.enabled || true, scribe: false };
  const names = aiChars().filter(c => c.present !== false).map(c => c.name);
  let plan;
  if (opts.kind === 'begin' || opts.kind === 'direct') plan = { agents: [], narrate: true, focus: opts.kind === 'begin' ? 'Open the scene vividly and give the player a reason to act.' : '' , source: 'direct' };
  else if (S.planner && (en.rules || en.lore || names.length)) {
    const p = buildPrompt('plan', { task: 'Plan the response to the latest event: ' + lastInputText() });
    const r = await runAgent(p, { display: false, stream: false });
    plan = Core.parsePlan(r.text, { characterNames: names, enabled: en, userText: lastInputText() });
  } else {
    plan = Core.heuristicPlan(lastInputText(), { characterNames: names, defaultCharacters: true });
    plan.agents = plan.agents.filter(a => en[a.agent] !== false);
  }
  if (S.showRouting) pushSystem(`GM routing (${plan.source}): ${plan.agents.map(a => a.agent + (a.names && a.names.length ? '[' + a.names.join(', ') + ']' : '')).join(' → ') || 'narration only'}${plan.focus ? ' · focus: ' + plan.focus : ''}`);
  for (const step of plan.agents) {
    if (step.agent === 'lore') {
      const p = buildPrompt('lore', { task: step.task || 'What established facts matter right now?' });
      const r = await runAgent(p, { aside: true, task: step.task });
      if (/^\s*no relevant lore/i.test(r.text) && r.msg) { r.msg.hidden = true; rerenderMsg(r.msg); }
      else if (r.msg && !S.showLore) { r.msg.aside = true; }
    } else if (step.agent === 'rules') {
      await runRules(step.task);
      if (pendingRoll) { setStatus(''); pushSystem('Waiting for your roll — click the Roll button above.'); return; }
    }
  }
  if (plan.narrate !== false || !plan.agents.length) {
    const p = buildPrompt('gm', { task: plan.focus ? 'Narration focus: ' + plan.focus : (opts.direction ? 'Follow the director\'s instruction: ' + opts.direction : '') });
    const r = await runAgent(p, { task: p.task });
    const t = Core.extractToolCalls(r.text);
    if (t.calls.length) { const x = execTools(t.calls.filter(c => c.tool !== 'roll'), 'GM'); if (x.requested) { pendingRoll = true; return; } }
  }
  const step = plan.agents.find(a => a.agent === 'characters');
  if (step && names.length) {
    let speakers = [];
    if (D.agents.characters.enabled) {
      const p = buildPrompt('lead', { task: `Who reacts now? GM suggested: ${(step.names || []).join(', ') || 'anyone fitting'}. ${step.task || ''}` });
      const r = await runAgent(p, { display: false, stream: false });

/* ---------- Composer / sending ---------- */
const HELP = `**Commands**
- \`/roll 2d20kh1+5 Stealth\` or \`/r d20\` — roll dice (also: adv/dis)
- \`/ooc question\` — out-of-character message
- \`/gm instruction\` — direct the Game Master (e.g. "introduce a rival")
- \`/npc Name [direction]\` — make that character speak now
- \`/scene The old mill\` · \`/mood eerie, tense\` · \`/note author's note\`
- \`/length short|medium|long\` · \`/summarize\` · \`/continue\` · \`/begin\`
**Keys** — Enter send · Shift+Enter newline · Esc stop · Ctrl+K command palette · Ctrl+Shift+R regenerate · Alt+←/→ swipe · Ctrl+Shift+O new chat · Ctrl+B sidebar · Alt+1…9 views`;
async function handleSend() {
  if (busy || !chat) return;
  const inp = $('#chatInput'); const raw = inp.value; const text = raw.trim();
  const pc = playerChar();
  const sp = $('#speaker').value;
  const speaker = sp.startsWith('char:') ? charById(sp.slice(5)) : null;
  const userName = speaker ? speaker.name : (pc ? pc.name : 'Player');
  const clear = () => { inp.value = ''; autosize(inp); };
  if (!text) { await continueReply(); return; }
  if (text.startsWith('/')) {
    const m = /^\/(\w+)\s*([\s\S]*)$/.exec(text); const cmd = m ? m[1].toLowerCase() : ''; const arg = m ? m[2].trim() : '';
    if (cmd === 'help' || cmd === '?') { chat.messages.push({ id: uid(), role: 'agent', agent: 'scribe', name: 'Help', aside: true, swipes: [HELP], swipeIdx: 0, ts: Date.now() }); appendMsgEl(chat.messages[chat.messages.length - 1]); clear(); return; }
    if (cmd === 'roll' || cmd === 'r') {
      const mm = /^(.*?)(?:\s+(?:#\s*)?([A-Za-z][\w\s'()-]*))?$/.exec(arg || 'd20');
      let expr = arg || 'd20', label = '';
      if (mm && mm[2] && !/^(adv|dis|advantage|disadvantage)$/i.test(mm[2].trim()) && !Core.tryRoll(mm[1]).error) { expr = mm[1]; label = mm[2].trim(); }
      if (doRoll(expr, userName, label)) clear(); return;
    }
    if (cmd === 'ooc') { if (!arg) return; pushUser(arg, { ooc: true, name: userName }); clear(); return runTurn({}); }
    if (cmd === 'gm' || cmd === 'direct') { if (!arg) return; pushUser(arg, { direct: true, name: 'Director' }); clear(); return runTurn({ kind: 'direct', direction: arg }); }
    if (cmd === 'npc' || cmd === 'char') {
      const names = aiChars().map(c => c.name);
      let found = null, rest = '';
      for (const n of names.slice().sort((a, b) => b.length - a.length)) { if (arg.toLowerCase().startsWith(n.toLowerCase())) { found = n; rest = arg.slice(n.length).trim(); break; } }
      if (!found) { const first = arg.split(/\s+/)[0]; found = Core.matchName(first, names); rest = arg.slice(first.length).trim(); }
      if (!found) { toast('No AI-controlled character matches. Mark a character as AI-controlled in Party.'); return; }
      clear(); return runTurn({ kind: 'npc', charId: chars().find(c => c.name === found).id, direction: rest });
    }
    if (cmd === 'scene') { chat.scene.location = arg; markDirty('chat'); renderRightPanel(); clear(); toast('Scene set.'); return; }
    if (cmd === 'mood') { chat.scene.moods = arg.split(/[,\s]+/).filter(Boolean).slice(0, 5); markDirty('chat'); renderRightPanel(); clear(); return; }
    if (cmd === 'note') { chat.authorNote = arg; markDirty('chat'); renderRightPanel(); clear(); toast('Author\'s note set.'); return; }
    if (cmd === 'length') { if (LENGTHS[arg]) { chat.length = arg; markDirty('chat'); renderComposerBits(); } clear(); return; }
    if (cmd === 'summarize' || cmd === 'scribe') { clear(); return runScribe(false); }
    if (cmd === 'continue') { clear(); return continueReply(); }
    if (cmd === 'begin' || cmd === 'start') { clear(); return runTurn({ kind: 'begin' }); }
    toast('Unknown command. Type /help'); return;
  }
  if (sp === 'ooc') pushUser(text, { ooc: true, name: userName });
  else if (sp === 'gm') { pushUser(text, { direct: true, name: 'Director' }); clear(); return runTurn({ kind: 'direct', direction: text }); }
  else pushUser(text, { name: userName, charId: speaker ? speaker.id : undefined });
  clear();
  await runTurn({});
}
function pushUser(text, o) {
  const m = Object.assign({ id: uid(), role: 'user', text, ts: Date.now() }, o);
  chat.messages.push(m); appendMsgEl(m); markDirty('chat'); touchChat();
  if (!o.direct) progressEvents(Progress.onPlayerTurn());
  const ix = idxOf(chat.id);
  if (ix && /^New adventure/.test(ix.title) && !o.ooc) { ix.title = text.slice(0, 48) + (text.length > 48 ? '…' : ''); chat.title = ix.title; renderChatTree(); renderChatHeader(); }
}
function autosize(t) { t.style.height = 'auto'; t.style.height = Math.min(240, t.scrollHeight) + 'px'; }

/* ---------- Message actions ---------- */
async function msgAction(act, m, btn) {
  const idx = chat.messages.indexOf(m);
  if (act === 'copy') { const t = m.role === 'roll' ? `${m.who}: ${m.expr} = ${m.total} (${m.breakdown})` : Core.extractToolCalls(msgText(m)).clean; try { await navigator.clipboard.writeText(t); toast('Copied.'); } catch (e) { toast('Clipboard unavailable.'); } }
  else if (act === 'edit') {
    const el = document.getElementById('m-' + m.id).querySelector('.body');
    el.innerHTML = `<div class="edit-box"><textarea>${esc(msgText(m))}</textarea><div class="row" style="margin-top:6px"><button class="btn primary sm" data-editsave>Save</button><button class="btn sm" data-editcancel>Cancel</button></div></div>`;
    const ta = el.querySelector('textarea'); ta.focus(); autosize(ta);
    ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) el.querySelector('[data-editsave]').click(); if (e.key === 'Escape') rerenderMsg(m); });
    el.querySelector('[data-editsave]').onclick = () => { if (m.role === 'agent') m.swipes[m.swipeIdx] = ta.value; else m.text = ta.value; markDirty('chat'); rerenderMsg(m); };
    el.querySelector('[data-editcancel]').onclick = () => rerenderMsg(m);
  }
  else if (act === 'del') {
    chat.messages.splice(idx, 1); removeMsgEl(m); markDirty('chat');
    if ((chat.memory.cursor || 0) > idx) chat.memory.cursor--;
    toast('Message deleted', { action: 'Undo', onAction: () => { chat.messages.splice(idx, 0, m); if ((chat.memory.cursor || 0) >= idx) chat.memory.cursor++; markDirty('chat'); renderChatMessages(); } });
  }
  else if (act === 'regen') regenerate(m);
  else if (act === 'cont') {
    if (idx !== chat.messages.length - 1) { toast('Only the latest message can be continued.'); return; }
    continueReply();
  }
  else if (act === 'branch') duplicateChat(chat.id, idx);
  else if (act === 'swipePrev' || act === 'swipeNext') { const n = m.swipes.length; m.swipeIdx = ((m.swipeIdx || 0) + (act === 'swipeNext' ? 1 : -1) + n) % n; markDirty('chat'); rerenderMsg(m); }
  else if (act === 'retry') { chat.messages.splice(idx, 1); removeMsgEl(m); runTurn({}); }
  else if (act === 'doRequest' || act === 'doRequestAdv' || act === 'doRequestDis') {
    if (m.done) return;
    m.done = true; rerenderMsg(m);
    doRoll(m.expr + (act === 'doRequestAdv' ? ' adv' : act === 'doRequestDis' ? ' dis' : ''), m.who, m.label);
    markDirty('chat');
    if (isConfigured() && !chat.messages.slice(idx + 1).some(x => x.role === 'request' && !x.done)) runTurn({ kind: 'roll' });
  }
}
function exportChatMd(c) {
  const ix = idxOf(c.id); const cp = D.campaigns.find(x => x.id === ix.campaignId) || D.campaigns[0];
  const prev = chat; chat = c;

function getPath(o, p) { return p.split('.').reduce((a, k) => (a == null ? '' : a[k]), o) ?? ''; }
function setPath(o, p, v) { const ks = p.split('.'); const last = ks.pop(); const t = ks.reduce((a, k) => a[k] = a[k] || {}, o); t[last] = v; }
function updateDerived(c) {
  const pb = Core.profBonus(c.level), q = (s) => document.querySelector(`#sheet [data-d="${s}"]`);
  Core.ABILITIES.forEach(a => { const m = Core.abilityMod(c.abilities[a]); q('mod-' + a).textContent = Core.fmtMod(m); q('save-' + a).textContent = 'save ' + Core.fmtMod(m + (c.saves[a] ? pb : 0)); });
  Core.SKILLS.forEach(([k, , a]) => q('sk-' + k).textContent = Core.fmtMod(Core.abilityMod(c.abilities[a]) + pb * (+c.skills[k] || 0)));
  q('init').textContent = Core.fmtMod(Core.abilityMod(c.abilities.dex) + (+c.initBonus || 0));
  q('pb').textContent = '+' + pb; q('pp').textContent = 10 + Core.abilityMod(c.abilities.wis) + pb * (+c.skills.perception || 0);
}
function sheetRoll(spec, c, e) {
  const pb = Core.profBonus(c.level), mode = rollModeFromEvent(e);
  let mod = 0, label = '';
  const [kind, k] = spec.split(':');
  if (kind === 'check') { mod = Core.abilityMod(c.abilities[k]); label = Core.ABILITY_NAMES[k] + ' check'; }
  else if (kind === 'save') { mod = Core.abilityMod(c.abilities[k]) + (c.saves[k] ? pb : 0); label = Core.ABILITY_NAMES[k] + ' save'; }
  else if (kind === 'skill') { const s = Core.SKILLS.find(x => x[0] === k); mod = Core.abilityMod(c.abilities[s[2]]) + pb * (+c.skills[k] || 0); label = s[1]; }
  else if (kind === 'init') { mod = Core.abilityMod(c.abilities.dex) + (+c.initBonus || 0); label = 'Initiative'; }
  const r = doRoll(`1d20${mod ? (mod > 0 ? '+' : '') + mod : ''}${mode}`, c.name, label + (mode ? ` (${mode.trim()})` : ''), { toChat: S.sheetToChat && !!chat });
  if (r) toast(`${c.name} — ${label}: ${r.total}${r.crit ? ' (nat 20!)' : r.fumble ? ' (nat 1)' : ''}`);
}

async function importBotFile() {
  const f = await pickFile('.json,.png,application/json,image/png'); if (!f) return;
  try {
    let obj;
    if (/\.png$/i.test(f.name) || f.type === 'image/png') obj = Core.cardFromPng(new Uint8Array(await f.arrayBuffer()));
    else obj = JSON.parse(await f.text());
    const items = Array.isArray(obj) ? obj : obj.format === 'rpg-table-bots' ? obj.bots : [obj];
    let n = 0;
    items.forEach(o => {
      let b;
      if (o.format === 'rpg-table-bot' || (o.systemPrompt !== undefined && o.kind)) b = Object.assign({}, o.bot || o);
      else { const card = Core.parseCharacterCard(o); if (!card) return; b = card; }
      const scan = Core.checkScenarioSafety(b);
      if (!scan.ok) { toast(`Skipped "${b.name}": ${scan.reason}.`); return; }
      b.id = uid(); b.builtin = false; b.color = b.color || PALETTE[n % PALETTE.length]; b.style = b.style || {};
      D.bots.push(b); D.ui.selBot = b.id; n++;
    });
    markDirty('data'); renderBots(); toast(n ? `Imported ${n} bot(s).` : 'No valid bot or character card found.');
  } catch (e) { toast('Import failed: ' + e.message); }
}

  const replaced = new Set(user.filter(s => s.originId).map(s => s.originId)); // edited copies replace their original in the grid

    .concat(mature ? MATURE_SCENARIOS.map(s => Object.assign({ builtin: true, mature: true }, s)) : [])

}

async function applyChatScenario() {
  const d = scnEd.d; const cp = camp(); const pc = playerChar();
  const snapshot = { title: d.title || 'Chat', mature: d.mature, premise: d.premise, setting: d.setting, world: d.world, tone: d.tone, content_notes: d.content_notes, gm_directions: d.gm_directions, goal_or_challenge: d.goal_or_challenge, win_condition: d.win_condition, fail_condition: d.fail_condition,
    characters: d.characters.map(c => ({ name: c.name, age: c.age, role: c.role, appearance: c.appearance, personality: c.personality, speech_style: c.speech_style })) };
  if (d.characters.some(c => !String(c.name).trim())) { toast('Every character needs a name.'); return; }
  const chk = Core.validateScenario(snapshot, { matureMode: S.contentRating === 'mature' });
  if (!chk.ok) { toast(`Not applied: ${chk.reason}.`, { ms: 7000 }); if (/age|18|older|childlike/i.test(chk.reason)) { scnEd.tab = 'chars'; scnRender(true); } return; }
  // characters: update, add, remove (the player's character is never touched here)
  const keep = new Set(d.characters.filter(c => c.id).map(c => c.id));
  const removed = cp.characters.filter(c => (!pc || c.id !== pc.id) && !keep.has(c.id));
  if (removed.length && !await confirmModal('Remove characters?', `Remove ${removed.map(c => c.name).join(', ')} from this campaign?`, 'Remove')) { openScnSheet(scnEd); return; }
  cp.characters = cp.characters.filter(c => (pc && c.id === pc.id) || keep.has(c.id));
  d.characters.forEach((dc, i) => {
    let ch = dc.id && cp.characters.find(c => c.id === dc.id);
    if (!ch) { ch = scenarioToChar({ name: dc.name, kind: 'NPC' }, cp.characters.length + i); cp.characters.push(ch); dc.id = ch.id; }
    ch.name = String(dc.name).trim().slice(0, 60); ch.cls = dc.role; ch.appearance = dc.appearance;
    const a = String(dc.age).trim(); if (a) ch.age = a; else delete ch.age;
    ch.personality = Object.assign(ch.personality || {}, { traits: dc.personality, voice: dc.speech_style });
  });
  const sm = chat.scenarioMeta = Object.assign(chat.scenarioMeta || {}, { title: d.title, premise: d.premise, setting: d.setting, world: d.world, tone: d.tone, content_notes: d.content_notes, gm_directions: d.gm_directions, goal_or_challenge: d.goal_or_challenge, win_condition: d.win_condition, fail_condition: d.fail_condition });
  let lore = cp.lorebook.find(l => l.title === 'Scenario' && l.constant);
  if (!lore) { lore = { id: uid(), title: 'Scenario', keys: '', constant: true, enabled: true, priority: 5, content: '' }; cp.lorebook.push(lore); }
  lore.content = scnLoreText(sm);
  if (d.location !== undefined) { chat.scene = chat.scene || { moods: [] }; chat.scene.location = d.location; }
  const ix = idxOf(chat.id); if (ix && d.title.trim()) ix.title = d.title.trim();
  pushSystem('Scenario updated — the changes apply from the next GM turn.');
  markDirty('chat'); markDirty('data');
  scnEd.dirty = false; closeOverlay(); scnEd = null;
  renderChatView(); renderChatTree();
  toast('Scenario updated.');
}
async function importScenarioPack() {
  const f = await pickFile('.json,application/json'); if (!f) return;
  try {
    const obj = JSON.parse(await f.text());
    const arr = Array.isArray(obj) ? obj : (obj.scenarios || []);
    let ok = 0; const dropped = [];
    D.scenarios = D.scenarios || [];
    arr.forEach(o => {
      const s = Core.normalizeScenario(o); if (!s) return;
      const check = Core.validateScenario(s, { matureMode: S.contentRating === 'mature' });
      if (!check.ok) { dropped.push(s.title); return; }
      s.id = D.scenarios.some(x => x.id === s.id) || GENERAL_SCENARIOS.some(x => x.id === s.id) || MATURE_SCENARIOS.some(x => x.id === s.id) ? 'scn-' + uid() : s.id;
      if (s.originId && !builtinById(s.originId)) s.originId = '';
      D.scenarios.push(s); ok++;
    });
    markDirty('data'); renderScenarios();
    toast(`Imported ${ok} scenario(s).${dropped.length ? ' Rejected by safety check: ' + dropped.join(', ') : ''}`, { ms: 7000 });
  } catch (e) { toast('Import failed: ' + e.message); }
}

function scenarioToChar(sc, i) {
  if (typeof sc === 'string') sc = { name: sc };
  const kind = /player|pc/i.test(sc.kind || sc.type || '') ? 'PC' : /companion|ally/i.test(sc.kind || sc.role || '') ? 'PC' : 'NPC';
  const ch = blankChar(kind);
  const P = typeof sc.personality === 'string' ? { traits: sc.personality } : (sc.personality || {});
  Object.assign(ch, { name: String(sc.name).slice(0, 60), race: sc.race || sc.species || '', cls: sc.cls || sc.class || sc.role || '', level: +sc.level || 3, color: sc.color || PALETTE[(i + 2) % PALETTE.length], ai: !/player/i.test(sc.kind || '') });
  if (sc.age != null && sc.age !== '') ch.age = String(sc.age);
  if (sc.appearance) ch.appearance = String(sc.appearance);
  const extra = [sc.wants && 'Wants: ' + sc.wants, sc.fears && 'Fears: ' + sc.fears, sc.contradiction && 'Contradiction: ' + sc.contradiction, sc.quirk && 'Quirk: ' + sc.quirk, sc.relationship_arc && 'Relationship arc: ' + sc.relationship_arc].filter(Boolean).join('\n');
  const samples = Array.isArray(sc.dialogue_samples) && sc.dialogue_samples.length ? '\nSample lines (style only): ' + sc.dialogue_samples.slice(0, 4).join(' / ') : '';
  ch.personality = Object.assign(ch.personality, { traits: P.traits || '', ideals: P.ideals || '', bonds: P.bonds || '', flaws: P.flaws || '', voice: P.voice || sc.speech_style || sc.voice || '', backstory: [P.backstory || sc.description || sc.backstory || '', extra].filter(Boolean).join('\n') + samples });
  if (sc.hp) ch.hp = { cur: +sc.hp, max: +sc.hp, temp: 0 };
  if (sc.ac) ch.ac = +sc.ac;
  return ch;
}

     Progress.addXP(n, reason)                -> events[]
     Progress.applyTags(tags, ctx)            -> events[]   (tags from Core.parseProgressTags)

     Progress.isUnlocked(scenario)            -> bool
     Progress.onPlayerTurn() / onRoll(rec)    -> events[]

async function setPassphrase(change) {
  if (!hasCrypto()) { toast('Encryption needs a secure context (https://, http://localhost or file://). See Settings → Privacy.', { ms: 6000 }); return; }
  const v = await formModal({ title: change ? 'Change passphrase' : 'Encrypt your data', text: 'Chats, campaigns, settings and API keys will be encrypted on this device with AES-256-GCM (key derived with PBKDF2-SHA256, 310,000 iterations). You will need the passphrase every time you open the app. <b>It cannot be recovered.</b>',
    fields: (change ? [{ name: 'old', label: 'Current passphrase', type: 'password' }] : []).concat([{ name: 'p1', label: 'New passphrase (min. 8 characters)', type: 'password' }, { name: 'p2', label: 'Repeat passphrase', type: 'password' }]), ok: 'Encrypt' });
  if (!v) return;
  if (v.p1.length < 8) { toast('Passphrase too short.'); return; }
  if (v.p1 !== v.p2) { toast('Passphrases do not match.'); return; }
  try {
    if (change) await Store.unlock(v.old);
    setSaveInd('saving', 'Encrypting…');
    await flushSave(); await Store.rekey(v.p1);
    toast('🔒 Data encrypted.'); setSaveInd('', 'Saved · encrypted'); renderSettings(); updateLockUi();
  } catch (e) { toast(e.message); }
}

  const v = await formModal({ title: 'Encrypted backup', text: 'Choose a passphrase for this backup file (can differ from your app passphrase).', fields: [{ name: 'p1', label: 'Passphrase', type: 'password' }, { name: 'p2', label: 'Repeat', type: 'password' }], ok: 'Export' });

function openPalette() {
  const cmds = paletteCommands(); let sel = 0, shown = cmds;
  const ov = overlay(`<div class="modal palette"><input id="palIn" placeholder="Type a command, chat name, or /roll 2d6…" autocomplete="off"><div class="pal-list" id="palList"></div></div>`);
  const inp = $('#palIn'), list = $('#palList');
  const draw = () => {
    const q = inp.value.trim().toLowerCase();
    if (q.startsWith('/roll ') || q.startsWith('/r ')) { shown = [{ name: 'Roll ' + q.replace(/^\/r(oll)?\s+/, ''), key: 'Enter', run: () => doRoll(q.replace(/^\/r(oll)?\s+/, ''), (playerChar() || {}).name, ''), group: 'dice' }]; }
    else shown = cmds.filter(c => !q || q.split(/\s+/).every(w => c.name.toLowerCase().includes(w))).slice(0, 60);
    sel = Math.min(sel, Math.max(0, shown.length - 1));
    list.innerHTML = shown.map((c, i) => `<div class="pal-item ${i === sel ? 'sel' : ''}" data-i="${i}"><span class="g">${esc(c.group)}</span>${esc(c.name)}<span class="k">${esc(c.key)}</span></div>`).join('') || '<div class="pal-item muted">No matches</div>';
    const s = list.querySelector('.sel'); if (s) s.scrollIntoView({ block: 'nearest' });
  };
  const go = (i) => { const c = shown[i]; if (!c) return; closeOverlay(); c.run(); };
  inp.addEventListener('input', () => { sel = 0; draw(); });
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(shown.length - 1, sel + 1); draw(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); draw(); }
    else if (e.key === 'Enter') { e.preventDefault(); go(sel); }
    else if (e.key === 'Escape') closeOverlay();
  });
  list.addEventListener('click', (e) => { const it = e.target.closest('[data-i]'); if (it) go(+it.dataset.i); });
  draw(); inp.focus();
}

  d.campaigns.forEach(c => { c.lorebook = c.lorebook || []; c.notes = c.notes || []; c.characters = c.characters || []; c.combat = c.combat || { round: 0, turn: 0, combatants: [] }; c.characters.forEach(ch => { ch.conditions = ch.conditions || []; ch.personality = ch.personality || {}; }); });
